<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinuxOnTab Shell PiP Wrapper</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --panel: #111827;
      --panel-2: #0f172a;
      --line: #334155;
      --text: #dbe5f5;
      --muted: #9aa9c0;
      --accent: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(1200px 700px at 85% -10%, #14305f66 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 90%, #0d3a2e66 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #0b1220, #0a1220ee);
      z-index: 20;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
      color: #c7f9db;
    }

    .url {
      flex: 1;
      min-width: 240px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: #0b1324;
      color: var(--text);
      outline: none;
    }

    .url:focus { border-color: #60a5fa; }

    .btn {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }

    .btn:hover { background: #1c263a; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .pip {
      position: fixed;
      left: 40px;
      top: 62px;
      width: min(1100px, calc(100vw - 80px));
      height: min(700px, calc(100vh - 102px));
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #0f172a, #0b1324);
      box-shadow: 0 14px 40px #00000099;
      overflow: hidden;
      min-width: 360px;
      min-height: 220px;
      resize: both;
      z-index: 30;
    }

    .pip.minimized {
      height: 42px !important;
      min-height: 42px;
      resize: none;
    }

    .pip.maximized {
      left: 0 !important;
      top: 44px !important;
      width: 100vw !important;
      height: calc(100vh - 44px) !important;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      resize: none;
    }

    .pip-head {
      height: 42px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #111b2f, #0f172a);
      user-select: none;
      cursor: grab;
    }

    .pip-head.dragging { cursor: grabbing; }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 8px #22c55eaa;
      flex: 0 0 auto;
    }

    .title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #d8e7ff;
    }

    .ctl {
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0c1628;
      color: var(--text);
      cursor: pointer;
      padding: 0;
      line-height: 1;
      font: 16px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .ctl:hover { background: #1d2a43; }

    .ctl.min:hover { border-color: var(--warn); }
    .ctl.max:hover { border-color: #60a5fa; }
    .ctl.close:hover { border-color: var(--danger); color: #fecaca; }

    .frame-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .tabs {
      height: 34px;
      flex: 0 0 auto;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-bottom: 1px solid var(--line);
      background: #0d172a;
      overflow-x: auto;
    }

    .pip.maximized .tabs {
      display: flex;
    }

    .tab {
      max-width: 280px;
      min-width: 100px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      border: 1px solid #2e3a52;
      border-radius: 6px;
      background: #0f1b32;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .tab.active {
      border-color: #60a5fa;
      background: #11233f;
      color: #dbeafe;
    }

    .tab-close {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      margin-left: auto;
      opacity: 0.8;
    }

    .tab-close:hover { opacity: 1; color: #fecaca; }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .dock {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 40;
      display: none;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0c1628ee;
      backdrop-filter: blur(6px);
    }

    .dock.show { display: flex; }

    @media (max-width: 900px) {
      .hint { display: none; }
      .pip {
        left: 10px;
        top: 54px;
        width: calc(100vw - 20px);
        height: calc(100vh - 64px);
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">LinuxOnTab PiP</div>
    <input id="url" class="url" value="https://linuxontab.com/shell/" spellcheck="false" />
    <button id="go" class="btn">Go</button>
    <button id="newtab" class="btn" title="Create a new in-page PiP window and add it as a tab in fullscreen view">New Window</button>
    <div class="hint">Drag header to move. Resize from bottom-right corner.</div>
  </div>

  <div id="pip" class="pip" aria-label="PiP window">
    <div id="head" class="pip-head">
      <span class="dot" aria-hidden="true"></span>
      <div id="title" class="title">https://linuxontab.com/shell/</div>
      <button id="min" class="ctl min" title="Minimize">_</button>
      <button id="max" class="ctl max" title="Maximize / Restore">□</button>
      <button id="close" class="ctl close" title="Hide">×</button>
    </div>
    <div id="tabs" class="tabs" aria-label="Fullscreen tabbed view"></div>
    <div id="body" class="frame-wrap">
      <iframe id="frame" src="https://linuxontab.com/shell/" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    </div>
  </div>

  <div id="dock" class="dock" aria-live="polite">
    <span class="hint" style="display:block">PiP minimized/hidden</span>
    <button id="restore" class="btn">Restore PiP</button>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const pip = $('pip');
      const head = $('head');
      const tabsEl = $('tabs');
      const body = $('body');
      const frame = $('frame');
      const title = $('title');
      const urlInput = $('url');
      const goBtn = $('go');
      const openBtn = $('newtab');
      const minBtn = $('min');
      const maxBtn = $('max');
      const closeBtn = $('close');
      const dock = $('dock');
      const restoreBtn = $('restore');
      const hostBody = document.body;

      const LS_KEY = 'lot.pip-shell.state.v1';
      const DEFAULT_URL = 'https://linuxontab.com/shell/';

      let drag = null;
      let maximized = false;
      let minimized = false;
      let hidden = false;
      let preRect = null;
      let activeTabId = null;
      let tabs = [];
      let saveTimer = null;
      let zCounter = 60;
      let childCount = 0;

      function bringToFront(el) {
        if (!el) return;
        zCounter += 1;
        el.style.zIndex = String(zCounter);
      }

      function nextTabId() {
        return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      function tabTitleFromUrl(raw) {
        try {
          const u = new URL(raw);
          const p = (u.pathname || '/').replace(/\/$/, '') || '/';
          return (u.hostname + p).slice(0, 40);
        } catch (_) {
          return String(raw || 'tab').slice(0, 40);
        }
      }

      function normalizeUrl(raw) {
        let u = String(raw || '').trim();
        if (!u) return '';
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        return u;
      }

      function queueSaveState() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveState, 120);
      }

      function saveState() {
        try {
          const rect = getRect();
          const state = {
            rect,
            maximized,
            minimized,
            hidden,
            activeTabId,
            tabs: tabs.map(t => ({ id: t.id, url: t.url, label: t.label })),
            url: urlInput.value || '',
          };
          localStorage.setItem(LS_KEY, JSON.stringify(state));
        } catch (_) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (_) {
          return null;
        }
      }

      function setTitle(text) {
        title.textContent = text || 'PiP';
      }

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function getRect() {
        const r = pip.getBoundingClientRect();
        return {
          left: r.left,
          top: r.top,
          width: r.width,
          height: r.height,
        };
      }

      function applyRect(r) {
        pip.style.left = r.left + 'px';
        pip.style.top = r.top + 'px';
        pip.style.width = r.width + 'px';
        pip.style.height = r.height + 'px';
      }

      function renderTabs() {
        tabsEl.innerHTML = '';
        for (const t of tabs) {
          const tab = document.createElement('div');
          tab.className = 'tab' + (t.id === activeTabId ? ' active' : '');
          tab.title = t.url;
          tab.textContent = t.label || tabTitleFromUrl(t.url);
          tab.addEventListener('click', () => activateTab(t.id));

          const close = document.createElement('button');
          close.className = 'tab-close';
          close.type = 'button';
          close.textContent = '×';
          close.title = 'Close tab';
          close.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            closeTab(t.id);
          });

          tab.appendChild(close);
          tabsEl.appendChild(tab);
        }
      }

      function ensureActiveTab() {
        if (!tabs.length) {
          const u = normalizeUrl(urlInput.value) || DEFAULT_URL;
          tabs = [{ id: nextTabId(), url: u, label: tabTitleFromUrl(u) }];
          activeTabId = tabs[0].id;
        }
        if (!tabs.some(t => t.id === activeTabId)) activeTabId = tabs[0].id;
      }

      function activateTab(id) {
        const t = tabs.find(x => x.id === id);
        if (!t) return;
        activeTabId = t.id;
        loadUrl(t.url, { syncTab: false });
        renderTabs();
        queueSaveState();
      }

      function closeTab(id) {
        if (tabs.length <= 1) return;
        const idx = tabs.findIndex(t => t.id === id);
        if (idx < 0) return;
        const wasActive = tabs[idx].id === activeTabId;
        tabs.splice(idx, 1);
        if (wasActive) {
          const next = tabs[Math.max(0, idx - 1)] || tabs[0];
          activeTabId = next.id;
          loadUrl(next.url, { syncTab: false });
        }
        renderTabs();
        queueSaveState();
      }

      function addTab(url) {
        const u = normalizeUrl(url);
        if (!u) return;
        const tab = { id: nextTabId(), url: u, label: tabTitleFromUrl(u) };
        tabs.push(tab);
        activeTabId = tab.id;
        loadUrl(tab.url, { syncTab: false });
        renderTabs();
        queueSaveState();
      }

      function loadUrl(raw, opts) {
        const options = opts || {};
        const u = normalizeUrl(raw);
        if (!u) return;
        urlInput.value = u;
        frame.src = u;
        setTitle(u);
        if (options.syncTab !== false) {
          ensureActiveTab();
          const t = tabs.find(x => x.id === activeTabId);
          if (t) {
            t.url = u;
            t.label = tabTitleFromUrl(u);
          }
          renderTabs();
        }
        queueSaveState();
      }

      function spawnPipWindow(rawUrl) {
        const u = normalizeUrl(rawUrl) || DEFAULT_URL;
        childCount += 1;

        const el = document.createElement('div');
        el.className = 'pip';
        el.style.left = (80 + ((childCount - 1) * 24)) + 'px';
        el.style.top = (86 + ((childCount - 1) * 24)) + 'px';
        el.style.width = 'min(900px, calc(100vw - 120px))';
        el.style.height = 'min(560px, calc(100vh - 140px))';
        bringToFront(el);

        el.innerHTML =
          '<div class="pip-head">' +
            '<span class="dot" aria-hidden="true"></span>' +
            '<div class="title"></div>' +
            '<button class="ctl min" title="Minimize">_</button>' +
            '<button class="ctl max" title="Maximize / Restore">□</button>' +
            '<button class="ctl close" title="Close">×</button>' +
          '</div>' +
          '<div class="frame-wrap">' +
            '<iframe allow="clipboard-read; clipboard-write; fullscreen"></iframe>' +
          '</div>';

        hostBody.appendChild(el);

        const childHead = el.querySelector('.pip-head');
        const childTitle = el.querySelector('.title');
        const childMin = el.querySelector('.min');
        const childMax = el.querySelector('.max');
        const childClose = el.querySelector('.close');
        const childFrameWrap = el.querySelector('.frame-wrap');
        const childFrame = el.querySelector('iframe');

        let childDrag = null;
        let childMaximized = false;
        let childMinimized = false;
        let childPreRect = null;

        function childRect() {
          const r = el.getBoundingClientRect();
          return { left: r.left, top: r.top, width: r.width, height: r.height };
        }

        function childApplyRect(r) {
          el.style.left = r.left + 'px';
          el.style.top = r.top + 'px';
          el.style.width = r.width + 'px';
          el.style.height = r.height + 'px';
        }

        function childSetMinimized(v) {
          childMinimized = !!v;
          el.classList.toggle('minimized', childMinimized);
          childFrameWrap.style.display = childMinimized ? 'none' : 'flex';
        }

        function childSetMaximized(v) {
          const next = !!v;
          if (next === childMaximized) return;
          if (next) {
            childPreRect = childRect();
            el.classList.add('maximized');
            childMaximized = true;
            childMax.textContent = '❐';
            childMax.title = 'Restore';
          } else {
            el.classList.remove('maximized');
            childMaximized = false;
            childMax.textContent = '□';
            childMax.title = 'Maximize / Restore';
            if (childPreRect) childApplyRect(childPreRect);
          }
        }

        function childLoadUrl(nextUrl) {
          const cu = normalizeUrl(nextUrl) || DEFAULT_URL;
          childTitle.textContent = cu;
          childFrame.src = cu;
        }

        childFrame.addEventListener('load', () => {
          childTitle.textContent = childFrame.src || u;
        });

        childHead.addEventListener('pointerdown', (e) => {
          bringToFront(el);
          if (e.target.closest('button')) return;
          if (childMaximized) return;
          childDrag = {
            x: e.clientX,
            y: e.clientY,
            rect: childRect(),
          };
          childHead.classList.add('dragging');
          childHead.setPointerCapture(e.pointerId);
          e.preventDefault();
        });

        childHead.addEventListener('pointermove', (e) => {
          if (!childDrag) return;
          const dx = e.clientX - childDrag.x;
          const dy = e.clientY - childDrag.y;
          const w = childDrag.rect.width;
          const h = childDrag.rect.height;
          const left = clamp(childDrag.rect.left + dx, 0, Math.max(0, window.innerWidth - w));
          const top = clamp(childDrag.rect.top + dy, 44, Math.max(44, window.innerHeight - 32));
          el.style.left = left + 'px';
          el.style.top = top + 'px';
        });

        childHead.addEventListener('pointerup', (e) => {
          childDrag = null;
          childHead.classList.remove('dragging');
          try { childHead.releasePointerCapture(e.pointerId); } catch (_) {}
        });

        el.addEventListener('pointerdown', () => bringToFront(el));

        childMin.addEventListener('click', () => {
          if (childMaximized && childMinimized) childSetMaximized(false);
          childSetMinimized(!childMinimized);
          bringToFront(el);
        });

        childMax.addEventListener('click', () => {
          if (childMinimized) childSetMinimized(false);
          childSetMaximized(!childMaximized);
          bringToFront(el);
        });

        childClose.addEventListener('click', () => {
          try { el.remove(); } catch (_) {}
        });

        childLoadUrl(u);
      }

      function restoreVisibility() {
        hidden = false;
        pip.style.display = 'flex';
        dock.classList.remove('show');
        queueSaveState();
      }

      function showDock() {
        dock.classList.add('show');
      }

      function setMinimized(v) {
        minimized = !!v;
        pip.classList.toggle('minimized', minimized);
        body.style.display = minimized ? 'none' : 'flex';
        if (minimized) {
          showDock();
        } else if (!hidden) {
          dock.classList.remove('show');
        }
        queueSaveState();
      }

      function setMaximized(v) {
        const next = !!v;
        if (next === maximized) return;

        if (next) {
          preRect = getRect();
          pip.classList.add('maximized');
          maximized = true;
          maxBtn.textContent = '❐';
          maxBtn.title = 'Restore';
        } else {
          pip.classList.remove('maximized');
          maximized = false;
          maxBtn.textContent = '□';
          maxBtn.title = 'Maximize / Restore';
          if (preRect) applyRect(preRect);
        }
        renderTabs();
        queueSaveState();
      }

      goBtn.addEventListener('click', () => loadUrl(urlInput.value));
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          loadUrl(urlInput.value);
        }
      });

      openBtn.addEventListener('click', () => {
        const u = normalizeUrl(urlInput.value);
        if (!u) return;
        spawnPipWindow(u);
        addTab(u);
      });

      minBtn.addEventListener('click', () => {
        if (hidden) restoreVisibility();
        setMinimized(!minimized);
      });

      maxBtn.addEventListener('click', () => {
        if (hidden) restoreVisibility();
        if (minimized) setMinimized(false);
        setMaximized(!maximized);
      });

      closeBtn.addEventListener('click', () => {
        hidden = true;
        pip.style.display = 'none';
        showDock();
        queueSaveState();
      });

      restoreBtn.addEventListener('click', () => {
        restoreVisibility();
        if (minimized) setMinimized(false);
      });

      head.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        if (maximized) return;
        drag = {
          x: e.clientX,
          y: e.clientY,
          rect: getRect(),
        };
        head.classList.add('dragging');
        head.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      head.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        const w = drag.rect.width;
        const h = drag.rect.height;

        const left = clamp(drag.rect.left + dx, 0, Math.max(0, window.innerWidth - w));
        const top = clamp(drag.rect.top + dy, 44, Math.max(44, window.innerHeight - 32));

        pip.style.left = left + 'px';
        pip.style.top = top + 'px';
      });

      head.addEventListener('pointerup', (e) => {
        drag = null;
        head.classList.remove('dragging');
        try { head.releasePointerCapture(e.pointerId); } catch (_) {}
        queueSaveState();
      });

      const ro = new ResizeObserver(() => {
        if (!maximized) queueSaveState();
      });
      ro.observe(pip);

      window.addEventListener('keydown', (e) => {
        if (!(e.ctrlKey && e.altKey)) return;
        if (e.key === 'F4') {
          e.preventDefault();
          if (hidden) {
            restoreVisibility();
            return;
          }
          setMinimized(!minimized);
        }
        if (e.key === 'F5') {
          e.preventDefault();
          if (hidden) restoreVisibility();
          if (minimized) setMinimized(false);
          setMaximized(!maximized);
        }
      }, true);

      frame.addEventListener('load', () => {
        // Keep a readable title even for cross-origin URLs.
        setTitle(urlInput.value || frame.src);
      });

      const initial = loadState();
      if (initial && initial.rect && Number.isFinite(initial.rect.left) && Number.isFinite(initial.rect.top)) {
        applyRect({
          left: clamp(initial.rect.left, 0, Math.max(0, window.innerWidth - 80)),
          top: clamp(initial.rect.top, 44, Math.max(44, window.innerHeight - 40)),
          width: clamp(initial.rect.width || 900, 360, window.innerWidth),
          height: clamp(initial.rect.height || 540, 220, window.innerHeight - 44),
        });
      }

      if (initial && Array.isArray(initial.tabs) && initial.tabs.length) {
        tabs = initial.tabs
          .map(t => ({
            id: String(t.id || nextTabId()),
            url: normalizeUrl(t.url || '') || DEFAULT_URL,
            label: String(t.label || tabTitleFromUrl(t.url || DEFAULT_URL)),
          }));
        activeTabId = String(initial.activeTabId || tabs[0].id);
      } else {
        const start = normalizeUrl(urlInput.value) || DEFAULT_URL;
        tabs = [{ id: nextTabId(), url: start, label: tabTitleFromUrl(start) }];
        activeTabId = tabs[0].id;
      }

      ensureActiveTab();
      renderTabs();
      const active = tabs.find(t => t.id === activeTabId) || tabs[0];
      loadUrl((initial && initial.url) || active.url, { syncTab: false });

      if (initial && initial.hidden) {
        hidden = true;
        pip.style.display = 'none';
        showDock();
      }
      if (initial && initial.minimized) setMinimized(true);
      if (initial && initial.maximized) setMaximized(true);

      window.addEventListener('beforeunload', saveState);
    })();
  </script>
</body>
</html>
