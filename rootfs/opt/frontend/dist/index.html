    <!-- Televisions have no console we can reach. With ?diag=<host:port> the
         page beacons its first error back as an image request, which works on
         any engine old enough to need it. Inert without the parameter. -->
    <script>
      (function () {
        var m = /[?&]diag=([^&]+)/.exec(location.search);
        if (!m) return;
        var to = decodeURIComponent(m[1]);
        function send(kind, msg) {
          try {
            new Image().src = "http://" + to + "/diag?k=" + encodeURIComponent(kind) +
              "&m=" + encodeURIComponent(String(msg).slice(0, 400)) + "&t=" + (+new Date());
          } catch (e) {}
        }
        window.onerror = function (msg, src, line, col) {
          send("error", msg + "  @ " + (src || "?").split("/").pop() + ":" + line + ":" + col);
        };
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason || {};
          send("reject", r.stack || r.message || r);
        });
        send("boot", navigator.userAgent);
      })();
    </script>
