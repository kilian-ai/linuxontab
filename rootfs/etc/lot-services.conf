# Service registry for ?image=<name> / ?run=<name> tabs: /etc/rc installs the
# package (lot_svc) and starts the command, or just starts it (lot_run).
# name|command — a `tty:` command runs in the foreground on the console.
# Keep in sync with the lean image's copy in cloudflare/build-lean-rootfs.sh.
redis|redis-server --port 6379 --bind 0.0.0.0 --protected-mode no
nginx|nginx-demo
httpd|httpd-demo
spiel|spiel-demo
trust|tty:trust
xtiny|xtiny
