# Apache httpd on the LinuxOnTab wasm kernel — demo configuration.
#
# Started by `httpd-demo` as `httpd -X` (prefork MPM, one process, no
# children): a browser tab needs one worker, and it keeps the scoreboard in
# plain anonymous memory. sendfile and mmap are compiled out; responses go
# out through writev().
#
#   httpd-demo                 start serving /var/www/lot on port 8081
#   httpd -k stop              stop it
#   httpd -t                   check this file

ServerRoot "/usr/local/apache2"
PidFile    /var/run/httpd.pid
Listen     0.0.0.0:8081

User  nobody
Group nobody

ServerName  localhost
ServerAdmin root@localhost
ServerTokens    Full
ServerSignature On

# prefork sizing for a single-process browser tab
StartServers      1
MinSpareServers   1
MaxSpareServers   1
MaxRequestWorkers 4
KeepAlive         On
Timeout           30
HostnameLookups   Off
EnableSendfile    Off
EnableMMAP        Off

ErrorLog  /var/log/httpd/error.log
LogLevel  info
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /var/log/httpd/access.log common

TypesConfig /etc/httpd/mime.types
AddType text/html .html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "/var/www/lot"
<Directory "/var/www/lot">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex apache.html
IndexOptions FancyIndexing HTMLTable NameWidth=* SuppressDescription
IndexIgnore .??* *~ *#

Header set X-Served-By "Apache httpd on a wasm32 Linux kernel"

# live proof: the scoreboard and the compiled-in module list
ExtendedStatus On
<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>
<Location "/server-info">
    SetHandler server-info
    Require all granted
</Location>
