# nginx on the LinuxOnTab wasm kernel — demo configuration.
#
# Single-process mode: this kernel has real fork(), but one nginx process is
# all a browser tab needs, and it keeps every socket on the proven epoll path
# (no master/worker shared memory, no accept mutex). sendfile() is not
# compiled in; responses go out through writev().
#
#   nginx-demo            start serving /var/www/lot on port 8080
#   nginx -s stop         stop it
#   nginx -t              check this file

daemon off;
master_process off;
worker_processes 1;

error_log /var/log/nginx/error.log info;
pid       /var/run/nginx.pid;

events {
    use epoll;
    worker_connections 64;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile          off;
    tcp_nopush        off;
    keepalive_timeout 15;
    server_tokens     on;

    server {
        listen      0.0.0.0:8080;
        server_name localhost;

        root  /var/www/lot;
        index index.html;

        # live counters — proof the page is coming out of a real nginx
        location = /status {
            stub_status;
        }

        location = /api/hello {
            default_type application/json;
            return 200 '{"server":"nginx/$nginx_version","host":"$hostname","kernel":"linux 6.1 on wasm32","request":"$request"}\n';
        }
    }
}
