# nginx in front of the Spiel media server (spiel-demo).
#
# Why: uvicorn serves the API fine, but on this kernel Python's asyncio write
# path stalls on the page-injected NIC connection for bodies above ~40 KB
# (loopback is fine, nginx on the same path pushes 700 KB in milliseconds).
# So nginx owns port 8080: it serves the React bundle straight from disk and
# reverse-proxies /api/ to uvicorn on 127.0.0.1:8081 over loopback, buffering
# the responses. The same shape as a production deployment.
daemon off;
master_process off;
worker_processes 1;
error_log /var/log/nginx/spiel-error.log warn;
pid       /var/run/nginx-spiel.pid;
events { use epoll; worker_connections 64; }
http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   off;
    sendfile     off;
    keepalive_timeout 15;
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;
    server {
        listen 0.0.0.0:8080;
        root   /opt/frontend/dist;
        index  index.html;
        location /api/ {
            proxy_pass         http://127.0.0.1:8081;
            proxy_http_version 1.0;
            proxy_set_header   Host $host;
            proxy_set_header   Connection close;
            proxy_read_timeout 120s;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
