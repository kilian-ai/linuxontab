<!-- Cross-Origin Isolation: register ServiceWorker so SharedArrayBuffer is
     available on GitHub Pages. On first load the SW registers + reloads the
     page; subsequent loads go through the SW and get COOP/COEP headers. -->
<script>
(function () {
  if (typeof SharedArrayBuffer !== 'undefined') return; // already isolated
  if (!('serviceWorker' in navigator)) {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<p style="color:#f87171;padding:1em">Your browser does not support ServiceWorkers.<br>SharedArrayBuffer is required for the WASM kernel.</p>';
    });
    return;
  }
  navigator.serviceWorker.register('./coi-serviceworker.js', { scope: './' }).then(function (reg) {
    if (reg.active) {
      // SW is active but page wasn't isolated — reload to pick up headers.
      window.location.reload();
    } else {
      // SW just installed for the first time — wait for it to activate.
      reg.addEventListener('updatefound', function () {
        var worker = reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', function () {
          if (worker.state === 'activated') window.location.reload();
        });
      });
    }
  }).catch(function (err) {
    console.error('[coi-sw] registration failed:', err);
  });
})();
</script>

<script src="./xterm.js"></script>
<script src="./xterm-addon-fit.js"></script>
<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// @tombl/linux Machine API
// vmlinux-UHA6PIC5.wasm + worker-Q7XWPLKR.js must be in ./linux-dist/dist/
// ─────────────────────────────────────────────────────────────────────────────
import { Machine, ConsoleDevice, EntropyDevice } from './linux-dist/dist/index.js';

// ── helpers ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

// ── xterm.js setup ───────────────────────────────────────────────────────────
const term = new Terminal({
  cursorBlink: true,
  fontFamily: "'Menlo','Monaco','Consolas','Courier New',monospace",
  fontSize: 13,
  theme: {
    background: '#0b0d10',
    foreground: '#d5d8dc',
    cursor:     '#7ab8f5',
    selectionBackground: '#2a3a50',
  },
  allowProposedApi: true,
  scrollback: 5000,
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open($('term'));
fitAddon.fit();
window.addEventListener('resize', () => fitAddon.fit());

// ── state ─────────────────────────────────────────────────────────────────────
let machine = null;
let consoleInputWriter = null; // WritableStreamDefaultWriter<Uint8Array> — host → guest
let booted = false;

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = cls || 'hint';
}

// ── guest I/O ──────────────────────────────────────────────────────────────────
// Send raw bytes to the guest console (host → guest keyboard input).
function guestWrite(bytes) {
  if (!consoleInputWriter) return;
  consoleInputWriter.write(bytes).catch(() => {});
}

// Type a string into the guest terminal (useful for sending commands).
// Appends \r to submit the command.
function guestSend(text) {
  const enc = new TextEncoder();
  guestWrite(enc.encode(text + '\r'));
}

// ── boot ───────────────────────────────────────────────────────────────────────
async function doBoat() {
  if (booted) {
    term.write('\r\n\x1b[33m[wasm-shell] resetting machine…\x1b[0m\r\n');
    machine = null;
    consoleInputWriter = null;
    booted = false;
  }

  setStatus('booting…', 'hint');
  $('boot').disabled = true;
  $('reset').disabled = true;

  // Pipe: host keyboard → guest console input.
  const inputTransform = new TransformStream();
  consoleInputWriter = inputTransform.writable.getWriter();

  // Pipe: guest console output → xterm.
  let outputController;
  const outputStream = new WritableStream({
    write(chunk) {
      term.write(chunk);
    },
  });

  const consoleDev = new ConsoleDevice(inputTransform.readable, outputStream);
  const entropyDev = new EntropyDevice();

  // Connect xterm keyboard → guest console input.
  term.onData(data => {
    guestWrite(new TextEncoder().encode(data));
  });

  machine = new Machine({
    devices: [consoleDev, entropyDev],
    memoryMib: 128,
    cmdline: 'console=hvc0',
  });

  // Pipe the early boot console (pre-virtio kernel messages) to xterm.
  (async () => {
    const reader = machine.bootConsole.getReader();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      term.write(value);
    }
  })();

  machine.addEventListener('error', ev => {
    setStatus('error', 'err');
    term.write('\r\n\x1b[31m[wasm-shell] kernel error: ' + ev.message + '\x1b[0m\r\n');
    $('boot').disabled = false;
  });

  try {
    await machine.boot();
    booted = true;
    setStatus('running', 'ok');
    $('reset').disabled = false;
    $('tunnels').disabled = false;
    $('lot-bridge-btn').disabled = false;
    term.focus();
  } catch (err) {
    setStatus('boot failed', 'err');
    term.write('\r\n\x1b[31m[wasm-shell] boot failed: ' + err.message + '\x1b[0m\r\n');
    $('boot').disabled = false;
  }
}

$('boot').onclick = () => doBoat();
$('reset').onclick = () => doBoat();

// ── panel toggles ─────────────────────────────────────────────────────────────
const panels = { tunnels: $('tunnels-panel'), 'lot-bridge': $('lot-bridge-panel') };
function openPanel(name) {
  for (const [k, el] of Object.entries(panels)) el.hidden = (k !== name);
}
function closePanel() { for (const el of Object.values(panels)) el.hidden = true; }

$('tunnels').onclick     = () => $('tunnels-panel').hidden ? openPanel('tunnels')    : closePanel();
$('lot-bridge-btn').onclick = () => $('lot-bridge-panel').hidden ? openPanel('lot-bridge') : closePanel();
$('tunnels-close').onclick  = closePanel;
$('lb-close').onclick       = closePanel;

// ── tunnels panel ─────────────────────────────────────────────────────────────
const tunnelsLogEl = $('tunnels-log');

const TUNNEL_CMD_PREFIX = 'wget -qO /tmp/tunnel-up.sh https://linuxontab.com/local/tunnel-up.sh && sh /tmp/tunnel-up.sh';
const TUNNEL_PORTS_KEY  = 'traits.tunnels.ports';
const TUNNEL_DEFAULT_PORTS = [
  { port: 22,    label: 'ssh',            enabled: true,  channels: null, expose: true  },
  { port: 8080,  label: 'public-http',    enabled: true,  channels: null, expose: false },
  { port: 22000, label: 'syncthing-sync', enabled: true,  channels: null, expose: false },
  { port: 8384,  label: 'syncthing-gui',  enabled: true,  channels: 64,   expose: false },
];
const TUNNEL_RELAY_ENDPOINTS = [
  'https://linuxontab-tunnel.fly.dev',
  'https://tunnel.linuxontab.com',
];
const TUNNEL_EXPOSE_ENDPOINTS = ['https://linuxontab-tunnel.fly.dev'];

function tnLoadPorts() {
  try {
    const raw = localStorage.getItem(TUNNEL_PORTS_KEY);
    if (!raw) return TUNNEL_DEFAULT_PORTS.map(p => ({ ...p }));
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) throw new Error('not array');
    return arr.map(e => {
      const ch = parseInt(e.channels, 10);
      const port = parseInt(e.port, 10);
      let expose = typeof e.expose === 'boolean' ? e.expose : !TUNNEL_DEFAULT_PORTS.some(d => d.port === port);
      return { port, label: String(e.label || ''), enabled: !!e.enabled, channels: Number.isFinite(ch) && ch > 0 ? ch : null, expose };
    }).filter(e => Number.isFinite(e.port) && e.port > 0 && e.port < 65536);
  } catch (_) { return TUNNEL_DEFAULT_PORTS.map(p => ({ ...p })); }
}
function tnSavePorts(arr) {
  try { localStorage.setItem(TUNNEL_PORTS_KEY, JSON.stringify(arr)); } catch (_) {}
}
function tnEnabledPortSpecs() {
  return tnLoadPorts()
    .filter(e => e.enabled)
    .map(e => (e.channels && e.channels > 0) ? (e.port + ':' + e.channels) : String(e.port));
}
function tnBuildDefaultCmd() {
  const specs = tnEnabledPortSpecs();
  return TUNNEL_CMD_PREFIX + ' ' + (specs.length ? specs.join(' ') : '22');
}

function tnLog(line, cls) {
  const d = document.createElement('div');
  d.className = 'tl-' + (cls || 'info');
  d.textContent = line;
  tunnelsLogEl.appendChild(d);
  tunnelsLogEl.scrollTop = tunnelsLogEl.scrollHeight;
}

async function tnFetchRelayStatus(code) {
  if (!code) return null;
  for (const base of TUNNEL_RELAY_ENDPOINTS) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 4000);
      const r = await fetch(base + '/port/status?code=' + encodeURIComponent(code), { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) continue;
      const j = await r.json();
      return { endpoint: base, ...j };
    } catch (_) {}
  }
  return null;
}

function tnRenderPortsConfig() {
  const ports = tnLoadPorts();
  const list = $('tn-ports-list');
  list.innerHTML = '';
  ports.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'tn-port-row';

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = p.enabled;
    cb.onchange = () => { ports[i].enabled = cb.checked; tnSavePorts(ports); };

    const num = document.createElement('span');
    num.className = 'tn-port-num'; num.textContent = ':' + p.port;

    const lbl = document.createElement('input');
    lbl.type = 'text'; lbl.className = 'tn-port-label-input'; lbl.value = p.label; lbl.placeholder = 'label';
    lbl.onchange = () => { ports[i].label = lbl.value; tnSavePorts(ports); };

    const exp = document.createElement('label');
    exp.className = 'tn-port-expose' + (p.expose ? ' tn-expose-on' : '');
    const expCb = document.createElement('input');
    expCb.type = 'checkbox'; expCb.checked = !!p.expose;
    expCb.onchange = () => { ports[i].expose = expCb.checked; exp.className = 'tn-port-expose' + (expCb.checked ? ' tn-expose-on' : ''); tnSavePorts(ports); };
    exp.appendChild(expCb);
    exp.append('expose');

    const del = document.createElement('button');
    del.className = 'tn-port-del'; del.textContent = '×'; del.title = 'remove port';
    del.onclick = () => { ports.splice(i, 1); tnSavePorts(ports); tnRenderPortsConfig(); };

    row.append(cb, num, lbl, exp, del);
    list.appendChild(row);
  });
}
tnRenderPortsConfig();

$('tn-add-btn').onclick = () => {
  const portVal = parseInt($('tn-add-port').value, 10);
  if (!Number.isFinite(portVal) || portVal < 1 || portVal > 65535) return;
  const label = $('tn-add-label').value.trim();
  const ports = tnLoadPorts();
  if (!ports.find(p => p.port === portVal)) {
    ports.push({ port: portVal, label, enabled: true, channels: null, expose: true });
    tnSavePorts(ports);
    tnRenderPortsConfig();
    $('tn-add-port').value = '';
    $('tn-add-label').value = '';
  }
};

async function tnRefresh() {
  tnLog('scanning relay…', 'info');
  const list = $('tunnels-list');
  list.innerHTML = '';
  // Without serialVfs we can't exec in the guest; show a relay-query-only view.
  const code = localStorage.getItem('traits.tunnels.lastCode') || '';
  if (code) {
    const s = await tnFetchRelayStatus(code);
    const row = document.createElement('div');
    row.className = 'tn-row';
    if (s) {
      const active = !!s.active;
      const guestPorts = Array.isArray(s.guest_ports) ? s.guest_ports : [];
      row.innerHTML = '<span class="tn-code">code: ' + code + '</span>' +
        '<div class="tn-meta ' + (active ? 'tn-relay-ok' : 'tn-relay-warn') + '">relay: ' +
        (active ? '✓ active' : '✗ inactive') +
        (guestPorts.length ? '  guest=' + guestPorts.join(',') : '') + '</div>';
    } else {
      row.innerHTML = '<span class="tn-code">code: ' + code + '</span><div class="tn-meta tn-relay-err">relay: unreachable</div>';
    }
    list.appendChild(row);
    tnLog('done', 'ok');
  } else {
    const row = document.createElement('div');
    row.className = 'tn-row tn-empty';
    row.textContent = 'no active code — run tunnel-up in the guest to get one';
    list.appendChild(row);
    tnLog('no code cached; run tunnel-up in guest first', 'info');
  }
}

$('tunnels-refresh').onclick = () => tnRefresh();

$('tn-run-btn').onclick = () => {
  const cmd = tnBuildDefaultCmd();
  tnLog('sending to guest: ' + cmd, 'cmd');
  guestSend(cmd);
  tnLog('sent — watch the terminal', 'ok');
};

// ── lot-bridge panel ──────────────────────────────────────────────────────────
(function () {
  const lbBtn       = $('lot-bridge-btn');
  const lbPanel     = $('lot-bridge-panel');
  const lbClose     = $('lb-close');
  const lbStart     = $('lb-start');
  const lbStop      = $('lb-stop');
  const lbStatusBtn = $('lb-status-btn');
  const lbRefresh   = $('lb-refresh');
  const lbPorts     = $('lb-ports');
  const lbRelay     = $('lb-relay');
  const lbDot       = $('lb-dot');
  const lbStateLabel = $('lb-state-label');
  const lbCodeVal   = $('lb-code-val');
  const lbPoolInfo  = $('lb-pool-info');
  const lbLog       = $('lb-log');

  function lbAppend(text, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    lbLog.appendChild(line);
    lbLog.scrollTop = lbLog.scrollHeight;
  }

  function lbSetRunning(running, code) {
    lbDot.className = running ? 'ok' : '';
    lbStateLabel.textContent = running ? 'running' : 'not running';
    lbCodeVal.textContent = (running && code) ? 'code: ' + code : '';
  }

  // guestExec: type a command into the guest terminal and wait.
  // Because we don't have serialVfs output capture, this just sends the cmd
  // and returns after a delay. Output appears in the terminal directly.
  async function lbExec(cmd, opts) {
    guestSend(cmd);
    const wait = (opts && opts.timeout) ? Math.min(opts.timeout, 3000) : 1500;
    await new Promise(r => setTimeout(r, wait));
    return { stdout: '', exitCode: 0 };
  }

  async function lbReadStatus() {
    // Ask the guest to print the status JSON to a known marker line.
    guestSend('echo __LB_STATUS__; cat /tmp/lot-bridge.status.json 2>/dev/null || echo __LB_NOFILE__; echo __LB_END__');
    lbAppend('checking status (check terminal output)…', 'lb-info');
    await new Promise(r => setTimeout(r, 2000));
    return null; // can't capture output without serialVfs
  }

  async function lbRefreshUI() {
    lbAppend('refresh: check terminal for lot-bridge status output', 'lb-info');
    guestSend('cat /tmp/lot-bridge.status.json 2>/dev/null || echo "(lot-bridge not running)"');
    guestSend('cat /tmp/lot-bridge.code 2>/dev/null && echo || true');
    await new Promise(r => setTimeout(r, 1000));
  }

  async function lbDoStart() {
    const ports = (lbPorts.value || '22 8080').trim().split(/\s+/).filter(Boolean);
    const relay = (lbRelay.value || 'https://linuxontab-tunnel.fly.dev').trim();
    if (!ports.length) { lbAppend('no ports specified', 'lb-err'); return; }

    lbAppend('downloading lot-bridge binary…', 'lb-info');
    guestSend(
      'rm -f /usr/local/bin/lot-bridge; ' +
      'wget -qO /usr/local/bin/lot-bridge https://raw.githubusercontent.com/kilian-ai/linuxontab/main/local/lot-bridge ' +
      '|| wget -qO /usr/local/bin/lot-bridge https://linuxontab.com/local/lot-bridge; ' +
      'chmod +x /usr/local/bin/lot-bridge; ' +
      '/usr/local/bin/lot-bridge --version 2>&1'
    );
    lbAppend('waiting for download (watch terminal)…', 'lb-info');
    await new Promise(r => setTimeout(r, 8000));

    guestSend('lot-bridge down 2>/dev/null; killall -q websocat 2>/dev/null; killall -q lot-bridge 2>/dev/null; true');
    guestSend('rm -f /tmp/lot-bridge.code /tmp/lot-bridge.status.json /tmp/lot-bridge.pid');
    await new Promise(r => setTimeout(r, 600));

    const cmd = `LOT_BRIDGE_RELAY='${relay}' lot-bridge up ${ports.join(' ')} > /tmp/lot-bridge.log 2>&1 &`;
    lbAppend('starting: ' + cmd, 'lb-info');
    guestSend(cmd);
    lbAppend('sent — watching for code (check terminal)…', 'lb-info');

    // Poll for code via terminal output — we can only ask the guest to print it.
    for (let i = 0; i < 8; i++) {
      await new Promise(r => setTimeout(r, 1500));
      guestSend('cat /tmp/lot-bridge.code 2>/dev/null | tr -d "\\n"; echo');
    }
    lbAppend('done — copy code from terminal output above', 'lb-ok');
    lbSetRunning(true, '?');
  }

  async function lbDoStop() {
    lbAppend('stopping…', 'lb-info');
    guestSend('lot-bridge down 2>/dev/null; killall -q websocat 2>/dev/null; killall -q lot-bridge 2>/dev/null; true');
    await new Promise(r => setTimeout(r, 800));
    lbSetRunning(false, null);
    lbPoolInfo.textContent = '';
    lbAppend('stop command sent', 'lb-ok');
  }

  lbStart.onclick = async () => {
    lbStart.disabled = true;
    try { await lbDoStart(); }
    catch (e) { lbAppend('error: ' + e.message, 'lb-err'); }
    finally { lbStart.disabled = false; }
  };

  lbStop.onclick = async () => {
    lbStop.disabled = true;
    try { await lbDoStop(); }
    finally { lbStop.disabled = false; }
  };

  lbStatusBtn.onclick = async () => {
    lbStatusBtn.disabled = true;
    try {
      lbAppend('requesting status (see terminal)…', 'lb-info');
      guestSend('cat /tmp/lot-bridge.status.json 2>/dev/null | head -20 || echo "(not running)"');
      guestSend('cat /tmp/lot-bridge.code 2>/dev/null && echo || true');
    } finally { lbStatusBtn.disabled = false; }
  };

  lbRefresh.onclick = async () => {
    lbRefresh.disabled = true;
    try { await lbRefreshUI(); }
    finally { lbRefresh.disabled = false; }
  };
})();
</script>
</body>
</html>
