<!-- Cross-Origin Isolation: register ServiceWorker so SharedArrayBuffer is
     available on GitHub Pages. On first load the SW registers + reloads the
     page; subsequent loads go through the SW and get COOP/COEP headers. -->
<script>
(function () {
  if (typeof SharedArrayBuffer !== 'undefined') return; // already isolated
  if (!('serviceWorker' in navigator)) {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<p style="color:#f87171;padding:1em">Your browser does not support ServiceWorkers.<br>SharedArrayBuffer is required for the WASM kernel.</p>';
    });
    return;
  }
  navigator.serviceWorker.register('./coi-serviceworker.js', { scope: './' }).then(function (reg) {
    if (reg.active) {
      // SW is active but page wasn't isolated — reload to pick up headers.
      window.location.reload();
    } else {
      // SW just installed for the first time — wait for it to activate.
      reg.addEventListener('updatefound', function () {
        var worker = reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', function () {
          if (worker.state === 'activated') window.location.reload();
        });
      });
    }
  }).catch(function (err) {
    console.error('[coi-sw] registration failed:', err);
  });
})();
</script>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// @tombl/linux Machine API
// vmlinux-UHA6PIC5.wasm + worker-Q7XWPLKR.js must be in ./linux-dist/dist/
// ─────────────────────────────────────────────────────────────────────────────
import { Machine, BlockDevice, ConsoleDevice, EntropyDevice, NetworkDevice } from './linux-dist/dist/index.js';

// ─────────────────────────────────────────────────────────────────────────────
// WispSlirp — Browser-side SLIRP + WISP networking for the WASM kernel
// ─────────────────────────────────────────────────────────────────────────────
// Network topology (static, matches kernel cmdline ip= parameter):
//   Guest NIC:  192.168.86.100 / 24, gateway 192.168.86.1
//   SLIRP side: 192.168.86.1 (this code, uses GW_MAC below)
//   Guest MAC:  passed in from caller (randomized per boot)
//   Gateway MAC: 52:54:00:01:02:03
//
// TCP:   Guest SYN → WISP CONNECT to dest host:port → bridge TCP ↔ WISP
// UDP53: Guest DNS → DoH via relay.linuxontab.com → UDP response back
// ARP:   Respond to "who has 192.168.86.1?" with gateway MAC
// ─────────────────────────────────────────────────────────────────────────────
class WispSlirp {
  static GW_MAC  = new Uint8Array([0x52, 0x54, 0x00, 0x01, 0x02, 0x03]);
  static GW_IP   = new Uint8Array([192, 168, 86, 1]);
  static GUEST_IP = new Uint8Array([192, 168, 86, 100]);

  #url;
  #ws = null;
  #wsReady = false;
  #wsQueue = [];
  #reconnectTimer = null;
  #streamId = 1;
  #streams = new Map();   // id → { onData, onClose }
  #tcpConns = new Map();  // guestSrcPort → TcpConn
  #guestMac = null;
  #dnsCache = new Map();  // ipStr → hostname (from snooped DNS responses)

  backend = {
    send: frame => this.#onGuestFrame(frame),
    receive: null,  // set by NetworkDevice constructor
  };

  constructor(url = 'wss://linuxontab-net.fly.dev/wisp') {
    this.#url = url;
    this.#connectWisp();
  }

  // ── WISP connection ────────────────────────────────────────────────────────
  #connectWisp() {
    this.#ws = new WebSocket(this.#url);
    this.#ws.binaryType = 'arraybuffer';
    this.#ws.onopen = () => {
      console.log('[WISP] WebSocket open');
      this.#wsReady = true;
      for (const pkt of this.#wsQueue) this.#ws.send(pkt);
      this.#wsQueue = [];
    };
    this.#ws.onmessage = ev => this.#onWispMsg(new Uint8Array(ev.data));
    this.#ws.onclose = this.#ws.onerror = (ev) => {
      console.log('[WISP] WebSocket closed/error', ev?.code, ev?.reason);
      this.#wsReady = false;
      this.#streams.clear();
      this.#tcpConns.clear();
      if (!this.#reconnectTimer)
        this.#reconnectTimer = setTimeout(() => {
          this.#reconnectTimer = null; this.#connectWisp();
        }, 2000);
    };
  }

  #wispSend(buf) {
    if (this.#wsReady) this.#ws.send(buf); else this.#wsQueue.push(buf);
  }

  #wispConnect(host, port) {
    const id = this.#streamId++;
    const resolvedHost = this.#dnsCache.get(host) || host;
    if (resolvedHost !== host) console.log('[WISP] CONNECT', resolvedHost, port, '(resolved from', host+')');
    else console.log('[WISP] CONNECT', resolvedHost, port);
    const hostBytes = new TextEncoder().encode(resolvedHost);
    const pkt = new Uint8Array(1 + 4 + 1 + 2 + hostBytes.length);
    const dv = new DataView(pkt.buffer);
    pkt[0] = 0x01;                  // CONNECT
    dv.setUint32(1, id, true);      // stream ID (LE)
    pkt[5] = 0x01;                  // TCP
    dv.setUint16(6, port, true);    // port (LE) — WISP v1 uses little-endian
    pkt.set(hostBytes, 8);
    this.#streams.set(id, { onData: null, onClose: null });
    this.#wispSend(pkt);
    return id;
  }

  #wispData(id, data) {
    const pkt = new Uint8Array(5 + data.length);
    pkt[0] = 0x02;
    new DataView(pkt.buffer).setUint32(1, id, true);
    pkt.set(data, 5);
    this.#wispSend(pkt);
  }

  #wispClose(id) {
    const pkt = new Uint8Array(7);
    pkt[0] = 0x04;
    new DataView(pkt.buffer).setUint32(1, id, true);
    pkt[5] = 0x01;  // reason: voluntary
    this.#wispSend(pkt);
    this.#streams.delete(id);
  }

  #onWispMsg(buf) {
    if (buf.length < 5) return;
    const type = buf[0];
    const id = new DataView(buf.buffer, buf.byteOffset).getUint32(1, true);
    const payload = buf.slice(5);
    if (type === 0x02) {
      const s = this.#streams.get(id);
      if (s?.onData) { console.log('[WISP] DATA sid='+id+' len='+payload.length); s.onData(payload); }
      else console.log('[WISP] DATA sid='+id+' — no handler!');
    } else if (type === 0x04) {
      const reason = payload.length > 0 ? payload[0] : -1;
      const reasons = {1:'voluntary',2:'unexpected',3:'blocked',4:'throttled',0x41:'server_err',0x42:'unreach'};
      console.log('[WISP] CLOSE sid='+id+' reason='+reason+'('+(reasons[reason]||'?')+')');
      const s = this.#streams.get(id);
      if (s?.onClose) s.onClose();
      this.#streams.delete(id);
    }
    // 0x03 CONTINUE (flow control): ignored — we rely on WS backpressure
  }

  // ── Guest frame dispatch ───────────────────────────────────────────────────
  #onGuestFrame(frame) {
    if (frame.length < 14) return;
    if (!this.#guestMac) this.#guestMac = frame.slice(6, 12).slice(); // learn guest MAC
    const ethertype = (frame[12] << 8) | frame[13];
    if (ethertype === 0x0806) this.#handleArp(frame.slice(14));
    else if (ethertype === 0x0800) this.#handleIpv4(frame.slice(14));
  }

  // ── ARP ───────────────────────────────────────────────────────────────────
  #handleArp(arp) {
    if (arp.length < 28) return;
    const oper = (arp[6] << 8) | arp[7];
    if (oper !== 1) return;  // only ARP requests
    const tpa = arp.slice(24, 28);
    if (!WispSlirp.#ipEq(tpa, WispSlirp.GW_IP)) return;  // not asking for us
    const sha = arp.slice(8, 14);   // sender hardware (guest MAC)
    const spa = arp.slice(14, 18);  // sender protocol (guest IP)
    console.log('[ARP] request from', Array.from(spa).join('.'), '→ sending reply');
    const reply = new Uint8Array(28);
    const dv = new DataView(reply.buffer);
    dv.setUint16(0, 1); dv.setUint16(2, 0x0800); reply[4]=6; reply[5]=4;
    dv.setUint16(6, 2);  // REPLY
    reply.set(WispSlirp.GW_MAC, 8);  reply.set(WispSlirp.GW_IP, 14);
    reply.set(sha, 18); reply.set(spa, 24);
    this.#sendEth(sha, WispSlirp.GW_MAC, 0x0806, reply);
  }

  // ── IPv4 ──────────────────────────────────────────────────────────────────
  #handleIpv4(ip) {
    if (ip.length < 20) return;
    const ihl = (ip[0] & 0x0f) * 4;
    const proto = ip[9];
    const srcIp = ip.slice(12, 16);
    const dstIp = ip.slice(16, 20);
    const payload = ip.slice(ihl);
    if (proto === 6) this.#handleTcp(srcIp, dstIp, payload);
    else if (proto === 17) this.#handleUdp(srcIp, dstIp, payload);
    else if (proto === 1) this.#handleIcmp(srcIp, dstIp, payload);
  }

  // ── ICMP ──────────────────────────────────────────────────────────────────
  #handleIcmp(srcIp, dstIp, icmp) {
    if (icmp.length < 8) return;
    const type = icmp[0];
    if (type !== 8) return;  // only handle echo request (type=8)
    // Build echo reply: copy payload, set type=0
    const reply = new Uint8Array(icmp.length);
    reply.set(icmp);
    reply[0] = 0;  // type: echo reply
    reply[1] = 0;  // code: 0
    reply[2] = 0; reply[3] = 0;  // zero checksum for recalculation
    const dv = new DataView(reply.buffer);
    dv.setUint16(2, WispSlirp.#cksum(reply), false);
    // Send from dstIp (the target host) back to srcIp (the guest)
    this.#sendIpv4(dstIp, srcIp, 1, reply);
  }

  // ── TCP ───────────────────────────────────────────────────────────────────
  #handleTcp(srcIp, dstIp, tcp) {
    if (tcp.length < 20) return;
    const dv = new DataView(tcp.buffer, tcp.byteOffset);
    const srcPort = dv.getUint16(0, false);
    const dstPort = dv.getUint16(2, false);
    const seq     = dv.getUint32(4, false);
    const dataOff = ((tcp[12] >> 4) & 0xf) * 4;
    const flags   = tcp[13];
    const data    = tcp.slice(dataOff);
    const [SYN, ACK, FIN, RST, PSH] = [0x02, 0x10, 0x01, 0x04, 0x08];

    if (flags & RST) {
      const conn = this.#tcpConns.get(srcPort);
      if (conn?.wispId) this.#wispClose(conn.wispId);
      this.#tcpConns.delete(srcPort);
      return;
    }

    // New connection SYN
    if ((flags & SYN) && !(flags & ACK)) {
      // Ignore SYN retransmits — connection already in progress
      if (this.#tcpConns.has(srcPort)) return;
      const dstStr = Array.from(dstIp).join('.');
      console.log('[TCP] SYN', Array.from(srcIp).join('.')+':'+srcPort, '→', dstStr+':'+dstPort);
      const myIsn  = (Math.random() * 0x80000000 | 0) >>> 0;
      // Intercept connections to gateway:80 for local HTTP proxy
      if (dstStr === Array.from(WispSlirp.GW_IP).join('.') && dstPort === 80) {
        const conn = {
          wispId: null, httpBuf: new Uint8Array(0),
          mySeq: myIsn, guestSeq: (seq + 1) >>> 0,
          srcIp: [...srcIp], srcPort,
          dstIp: [...dstIp], dstPort,
        };
        this.#tcpConns.set(srcPort, conn);
        this.#tcpSynAck(conn, seq);
        return;
      }
      const wispId = this.#wispConnect(dstStr, dstPort);
      const conn = {
        wispId, mySeq: myIsn,
        guestSeq: (seq + 1) >>> 0,
        srcIp: [...srcIp], srcPort,
        dstIp: [...dstIp], dstPort,
      };
      this.#tcpConns.set(srcPort, conn);
      const s = this.#streams.get(wispId);
      if (s) {
        s.onData  = chunk => this.#tcpToGuest(conn, chunk);
        s.onClose = () => { this.#tcpSendFin(conn); this.#tcpConns.delete(srcPort); };
      }
      this.#tcpSynAck(conn, seq);
      return;
    }

    const conn = this.#tcpConns.get(srcPort);
    if (!conn) return;

    if (flags & FIN) {
      if (conn.wispId) this.#wispClose(conn.wispId);
      conn.guestSeq = (seq + 1) >>> 0;
      this.#tcpSendFin(conn);
      this.#tcpConns.delete(srcPort);
      return;
    }

    if ((flags & ACK) && data.length > 0) {
      // Only forward new data (skip retransmits where seq < expected guestSeq)
      const seqDiff = (seq - conn.guestSeq) | 0;  // signed 32-bit
      if (seqDiff >= 0) {
        conn.guestSeq = (seq + data.length) >>> 0;
        if (conn.wispId) {
          this.#wispData(conn.wispId, data);
        } else if (conn.httpBuf !== undefined) {
          // Local HTTP proxy: accumulate request bytes
          const combined = new Uint8Array(conn.httpBuf.length + data.length);
          combined.set(conn.httpBuf); combined.set(data, conn.httpBuf.length);
          conn.httpBuf = combined;
          const reqStr = new TextDecoder().decode(conn.httpBuf);
          if (reqStr.includes('\r\n\r\n') && !conn.httpHandled) {
            conn.httpHandled = true;
            this.#handleLocalHttp(conn, reqStr).catch(console.error);
          }
        }
      }
      // Always ACK so guest doesn't retransmit
      this.#tcpAck(conn);
    }
  }

  // ── Local HTTP proxy at gateway:80 ────────────────────────────────────────
  //
  // Supports three request forms — guest browsers/wgets can pick any:
  //
  //   1. GET /packages/foo.tar.gz HTTP/1.1     (origin-form, served from
  //                                             linuxontab.com — used by apk)
  //   2. GET http://example.com/path HTTP/1.1  (absolute-form, used by wget
  //                                             when http_proxy=192.168.86.1)
  //   3. GET /path HTTP/1.1 + Host: example.com  (host-header routing)
  //
  // For any https://… target the guest would otherwise hit directly, set
  //   export http_proxy=http://192.168.86.1/
  //   export https_proxy=http://192.168.86.1/    # wget tunnels via CONNECT
  // …or just use http://example.com/ — the host browser does the real TLS
  // via fetch(), so HTTPS-grade transport security is preserved end-to-end.
  async #handleLocalHttp(conn, reqStr) {
    const lines = reqStr.split('\r\n');
    const firstLine = lines[0] || '';
    const [method, target] = firstLine.split(' ');
    // Parse Host: header (case-insensitive)
    let hostHdr = '';
    for (let i = 1; i < lines.length; i++) {
      const ln = lines[i];
      if (!ln) break;
      const c = ln.indexOf(':');
      if (c < 0) continue;
      if (ln.slice(0, c).toLowerCase() === 'host') {
        hostHdr = ln.slice(c + 1).trim();
        break;
      }
    }
    // Resolve target → absolute URL
    const GW = '192.168.86.1';
    let url;
    if (/^https?:\/\//i.test(target)) {
      // absolute-form (wget through http_proxy=). If host is the gateway,
      // treat the path as origin-form against the LinuxOnTab CDN.
      try {
        const u = new URL(target);
        if (u.hostname === GW) {
          if (u.pathname.startsWith('/_https/')) {
            url = 'https://' + u.pathname.slice('/_https/'.length) + u.search;
          } else if (u.pathname.startsWith('/_http/')) {
            url = 'http://' + u.pathname.slice('/_http/'.length) + u.search;
          } else {
            const base = window.location.hostname === 'localhost'
              ? window.location.origin : 'https://linuxontab.com';
            url = base + u.pathname + u.search;
          }
        } else {
          url = target;
        }
      } catch { url = target; }
    } else if (target.startsWith('/_https/')) {
      url = 'https://' + target.slice('/_https/'.length);  // explicit https
    } else if (target.startsWith('/_http/')) {
      url = 'http://' + target.slice('/_http/'.length);
    } else if (hostHdr && hostHdr !== '192.168.86.1') {
      url = 'http://' + hostHdr + target;          // host-header routing
    } else {
      // origin-form against the LinuxOnTab CDN (or same-origin in dev)
      const base = window.location.hostname === 'localhost'
        ? window.location.origin
        : 'https://linuxontab.com';
      url = base + target;
    }
    console.log('[HTTP-GW]', method, url);
    let respBytes;
    try {
      // Pass through method; for now only GET/HEAD have no body — sufficient
      // for wget/curl downloads. POST bodies could be added later.
      const resp = await fetch(url, { method: method || 'GET', redirect: 'follow' });
      const body = new Uint8Array(await resp.arrayBuffer());
      const status = resp.status + ' ' + (resp.statusText || 'OK');
      const ctype  = resp.headers.get('content-type') || 'application/octet-stream';
      const hdr = new TextEncoder().encode(
        'HTTP/1.0 ' + status + '\r\n' +
        'Content-Length: ' + body.length + '\r\n' +
        'Content-Type: ' + ctype + '\r\n' +
        'Connection: close\r\n\r\n');
      respBytes = new Uint8Array(hdr.length + body.length);
      respBytes.set(hdr); respBytes.set(body, hdr.length);
    } catch (e) {
      console.error('[HTTP-GW] error', e);
      const msg = 'fetch failed: ' + (e?.message || e);
      const body = new TextEncoder().encode(msg);
      const hdr = new TextEncoder().encode(
        'HTTP/1.0 502 Bad Gateway\r\nContent-Length: ' + body.length +
        '\r\nContent-Type: text/plain\r\nConnection: close\r\n\r\n');
      respBytes = new Uint8Array(hdr.length + body.length);
      respBytes.set(hdr); respBytes.set(body, hdr.length);
    }
    await this.#tcpToGuest(conn, respBytes);
    // Brief yield so the guest can ACK and read before we FIN.
    await new Promise(r => setTimeout(r, 50));
    this.#tcpSendFin(conn);
    this.#tcpConns.delete(conn.srcPort);
  }

  #tcpSynAck(conn, guestIsn) {
    const t = new Uint8Array(20);
    const dv = new DataView(t.buffer);
    dv.setUint16(0, conn.dstPort, false);
    dv.setUint16(2, conn.srcPort, false);
    dv.setUint32(4, conn.mySeq, false);
    dv.setUint32(8, (guestIsn + 1) >>> 0, false);
    t[12] = 0x50; t[13] = 0x12;  // data-offset=5, SYN+ACK
    new DataView(t.buffer).setUint16(14, 65535, false);
    conn.mySeq = (conn.mySeq + 1) >>> 0;
    conn.guestSeq = (guestIsn + 1) >>> 0;
    this.#tcpChecksum(t, new Uint8Array(conn.dstIp), new Uint8Array(conn.srcIp));
    this.#sendIpv4(new Uint8Array(conn.dstIp), new Uint8Array(conn.srcIp), 6, t);
  }

  // Pure ACK to the guest — confirms receipt of data up to conn.guestSeq.
  #tcpAck(conn) {
    const t = new Uint8Array(20);
    const dv = new DataView(t.buffer);
    dv.setUint16(0, conn.dstPort, false);
    dv.setUint16(2, conn.srcPort, false);
    dv.setUint32(4, conn.mySeq, false);
    dv.setUint32(8, conn.guestSeq, false);
    t[12] = 0x50; t[13] = 0x10;  // data-offset=5, ACK
    new DataView(t.buffer).setUint16(14, 65535, false);
    this.#tcpChecksum(t, new Uint8Array(conn.dstIp), new Uint8Array(conn.srcIp));
    this.#sendIpv4(new Uint8Array(conn.dstIp), new Uint8Array(conn.srcIp), 6, t);
  }

  #tcpSendFin(conn) {
    const t = new Uint8Array(20);
    const dv = new DataView(t.buffer);
    dv.setUint16(0, conn.dstPort, false);
    dv.setUint16(2, conn.srcPort, false);
    dv.setUint32(4, conn.mySeq, false);
    dv.setUint32(8, conn.guestSeq, false);
    t[12] = 0x50; t[13] = 0x11;  // FIN+ACK
    new DataView(t.buffer).setUint16(14, 65535, false);
    conn.mySeq = (conn.mySeq + 1) >>> 0;
    this.#tcpChecksum(t, new Uint8Array(conn.dstIp), new Uint8Array(conn.srcIp));
    this.#sendIpv4(new Uint8Array(conn.dstIp), new Uint8Array(conn.srcIp), 6, t);
  }

  async #tcpToGuest(conn, data) {
    console.log('[TCP] toGuest len='+data.length+' mySeq='+conn.mySeq+' guestSeq='+conn.guestSeq+' hasReceive='+(!!this.backend.receive));
    const MSS = 1400;
    // Yield to the browser event loop every N chunks so a large response
    // (e.g. 1.7 MB sqlite3 tarball) doesn't block rendering / keep the guest
    // kernel from draining the RX ring.
    const YIELD_EVERY = 8;            // ~11 KB between yields
    let i = 0;
    for (let off = 0; off < data.length; off += MSS) {
      const chunk = data.slice(off, Math.min(off + MSS, data.length));
      const t = new Uint8Array(20 + chunk.length);
      const dv = new DataView(t.buffer);
      dv.setUint16(0, conn.dstPort, false);
      dv.setUint16(2, conn.srcPort, false);
      dv.setUint32(4, conn.mySeq, false);
      dv.setUint32(8, conn.guestSeq, false);
      t[12] = 0x50; t[13] = 0x18;  // PSH+ACK
      dv.setUint16(14, 65535, false);
      t.set(chunk, 20);
      conn.mySeq = (conn.mySeq + chunk.length) >>> 0;
      this.#tcpChecksum(t, new Uint8Array(conn.dstIp), new Uint8Array(conn.srcIp));
      this.#sendIpv4(new Uint8Array(conn.dstIp), new Uint8Array(conn.srcIp), 6, t);
      if (++i % YIELD_EVERY === 0) {
        await new Promise(r => setTimeout(r, 0));
      }
    }
  }

  // ── UDP / DNS ─────────────────────────────────────────────────────────────
  #handleUdp(srcIp, dstIp, udp) {
    if (udp.length < 8) return;
    const dv = new DataView(udp.buffer, udp.byteOffset);
    const srcPort = dv.getUint16(0, false);
    const dstPort = dv.getUint16(2, false);
    const payload = udp.slice(8);
    if (dstPort === 53) this.#forwardDns(srcIp, srcPort, payload).catch(() => {});
  }

  // Parse a DNS name from a buffer at offset; returns { name, offset }.
  #parseDnsName(buf, offset) {
    const labels = [];
    while (offset < buf.length) {
      const len = buf[offset];
      if (len === 0) { offset++; break; }
      if ((len & 0xc0) === 0xc0) {
        const ptr = ((len & 0x3f) << 8) | buf[offset + 1];
        labels.push(this.#parseDnsName(buf, ptr).name);
        offset += 2; break;
      }
      offset++;
      labels.push(String.fromCharCode(...buf.slice(offset, offset + len)));
      offset += len;
    }
    return { name: labels.join('.'), offset };
  }

  // Snoop A records from a DNS response and cache ip → hostname.
  #snoopDnsResponse(buf) {
    if (buf.length < 12) return;
    const ancount = (buf[6] << 8) | buf[7];
    if (ancount === 0) return;
    // Skip past questions
    let off = 12;
    const qdcount = (buf[4] << 8) | buf[5];
    for (let i = 0; i < qdcount && off < buf.length; i++) {
      const { offset } = this.#parseDnsName(buf, off);
      off = offset + 4;  // skip qtype + qclass
    }
    // Parse answers
    for (let i = 0; i < ancount && off < buf.length; i++) {
      const { name, offset } = this.#parseDnsName(buf, off);
      off = offset;
      if (off + 10 > buf.length) break;
      const type = (buf[off] << 8) | buf[off + 1];
      const rdlen = (buf[off + 8] << 8) | buf[off + 9];
      off += 10;
      if (type === 1 && rdlen === 4 && off + 4 <= buf.length) {
        const ip = buf[off]+'.'+buf[off+1]+'.'+buf[off+2]+'.'+buf[off+3];
        this.#dnsCache.set(ip, name);
      }
      off += rdlen;
    }
  }

  async #forwardDns(clientIp, clientPort, query) {
    const resp = await fetch('https://relay.linuxontab.com/dns-query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/dns-message', 'Accept': 'application/dns-message' },
      body: query,
    });
    if (!resp.ok) return;
    const answer = new Uint8Array(await resp.arrayBuffer());
    this.#snoopDnsResponse(answer);
    const udpResp = new Uint8Array(8 + answer.length);
    const dv = new DataView(udpResp.buffer);
    dv.setUint16(0, 53, false);
    dv.setUint16(2, clientPort, false);
    dv.setUint16(4, udpResp.length, false);
    udpResp.set(answer, 8);
    this.#sendIpv4(WispSlirp.GW_IP, new Uint8Array(clientIp), 17, udpResp);
  }

  // ── Frame construction ────────────────────────────────────────────────────
  #sendEth(dstMac, srcMac, ethertype, payload) {
    const frame = new Uint8Array(14 + payload.length);
    frame.set(dstMac, 0); frame.set(srcMac, 6);
    frame[12] = ethertype >> 8; frame[13] = ethertype & 0xff;
    frame.set(payload, 14);
    console.log('[ETH] inject et=0x'+ethertype.toString(16)+' len='+frame.length+' hasReceive='+(!!this.backend.receive));
    if (this.backend.receive) this.backend.receive(frame);
    else console.log('[ETH] DROPPED — backend.receive not set!');
  }

  #sendIpv4(srcIp, dstIp, proto, payload) {
    const ipLen = 20 + payload.length;
    const ip = new Uint8Array(ipLen);
    const dv = new DataView(ip.buffer);
    ip[0] = 0x45;
    dv.setUint16(2, ipLen, false);
    dv.setUint16(4, (Math.random() * 0xffff | 0), false);
    ip[8] = 64; ip[9] = proto;
    ip.set(srcIp, 12); ip.set(dstIp, 16);
    dv.setUint16(10, WispSlirp.#cksum(ip.slice(0, 20)), false);
    ip.set(payload, 20);
    const dst = this.#guestMac || new Uint8Array([0xff,0xff,0xff,0xff,0xff,0xff]);
    this.#sendEth(dst, WispSlirp.GW_MAC, 0x0800, ip);
  }

  // ── Checksums ─────────────────────────────────────────────────────────────
  static #cksum(data) {
    let s = 0;
    for (let i = 0; i < data.length - 1; i += 2) s += (data[i] << 8) | data[i+1];
    if (data.length & 1) s += data[data.length-1] << 8;
    while (s >> 16) s = (s & 0xffff) + (s >> 16);
    return (~s) & 0xffff;
  }

  #tcpChecksum(tcp, srcIp, dstIp) {
    const pseudo = new Uint8Array(12 + tcp.length);
    pseudo.set(srcIp, 0); pseudo.set(dstIp, 4);
    pseudo[9] = 6;
    new DataView(pseudo.buffer).setUint16(10, tcp.length, false);
    pseudo.set(tcp, 12);
    new DataView(tcp.buffer).setUint16(16, WispSlirp.#cksum(pseudo), false);
  }

  static #ipEq(a, b) { return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3]; }
}

// ── helpers ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

// ── xterm.js setup ───────────────────────────────────────────────────────────
const term = new Terminal({
  cursorBlink: true,
  convertEol: true,
  fontFamily: "'Menlo','Monaco','Consolas','Courier New',monospace",
  fontSize: 13,
  theme: {
    background: '#0b0d10',
    foreground: '#d5d8dc',
    cursor:     '#7ab8f5',
    selectionBackground: '#2a3a50',
  },
  allowProposedApi: true,
  scrollback: 5000,
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open($('term'));
fitAddon.fit();
window.addEventListener('resize', () => fitAddon.fit());

term.attachCustomKeyEventHandler(ev => {
  if (ev.type !== 'keydown') return true;
  if (ev.ctrlKey && !ev.altKey && !ev.metaKey && ev.key.toLowerCase() === 'c') {
    guestWrite(new Uint8Array([0x03]));
    return false;
  }
  if (ev.ctrlKey && !ev.altKey && !ev.metaKey && ev.key.toLowerCase() === 'd') {
    guestWrite(new Uint8Array([0x04]));
    return false;
  }
  return true;
});

// ── state ─────────────────────────────────────────────────────────────────────
let machine = null;
let consoleInputWriter = null; // WritableStreamDefaultWriter<Uint8Array> — host → guest
let booted = false;
let onDataDisposable = null; // xterm onData handler — disposed on each boot to prevent accumulation
let bootConsoleAbort = null; // AbortController for the bootConsole reader loop

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = cls || 'hint';
}

// ── guest I/O ──────────────────────────────────────────────────────────────────
// Send raw bytes to the guest console (host → guest keyboard input).
function guestWrite(bytes) {
  if (!consoleInputWriter) return;
  consoleInputWriter.write(bytes).catch(() => {});
}

// Type a string into the guest terminal (useful for sending commands).
// Appends \r to submit the command.
function guestSend(text) {
  const enc = new TextEncoder();
  guestWrite(enc.encode(text + '\r'));
}

// ── boot ───────────────────────────────────────────────────────────────────────
async function doBoat() {
  if (booted) {
    term.write('\r\n\x1b[33m[wasm-shell] resetting machine…\x1b[0m\r\n');
    machine = null;
    consoleInputWriter = null;
    booted = false;
  }
  // Dispose previous onData handler so keystrokes aren't duplicated on reset.
  if (onDataDisposable) { onDataDisposable.dispose(); onDataDisposable = null; }
  // Abort previous bootConsole reader loop.
  if (bootConsoleAbort) { bootConsoleAbort.abort(); bootConsoleAbort = null; }

  setStatus('booting…', 'hint');
  $('boot').disabled = true;
  $('reset').disabled = true;
  $('break').disabled = true;

  // Pipe: host keyboard → guest console input.
  const inputTransform = new TransformStream();
  consoleInputWriter = inputTransform.writable.getWriter();

  // Pipe: guest console output → xterm.
  let outputController;
  const outputStream = new WritableStream({
    write(chunk) {
      term.write(chunk);
    },
  });

  const consoleDev = new ConsoleDevice(inputTransform.readable, outputStream);
  const entropyDev = new EntropyDevice();

  // VirtIO-net + SLIRP: guest gets a NIC with static IP 192.168.86.100/24.
  // WispSlirp proxies TCP through wss://linuxontab-net.fly.dev/wisp and
  // forwards DNS (UDP/53) via DoH at relay.linuxontab.com.
  const guestMac = new Uint8Array([0x52, 0x54, 0x00, 0x12, 0x34, 0x56]);
  const slirp = new WispSlirp();
  window.__slirp = slirp;
  const netDev = new NetworkDevice(guestMac, slirp.backend);
  window.__netDev = netDev;

  // Load userspace initramfs (pivot-root stub that hands off to rootfs.ext4).
  const imageCacheBust = Date.now().toString(36);
  const initcpioResp = await fetch('./linux-dist/initramfs.cpio?v=' + imageCacheBust, { cache: 'no-store' });
  const initcpio = new Uint8Array(await initcpioResp.arrayBuffer());

  // Load Alpine-like rootfs as a virtio block device (/dev/vda inside guest).
  const rootfsResp = await fetch('./linux-dist/rootfs.ext4?v=' + imageCacheBust, { cache: 'no-store' });
  const rootfsBuffer = await rootfsResp.arrayBuffer();
  const rootfsBytes = new Uint8Array(rootfsBuffer);
  const blockDev = new BlockDevice({
    capacity: rootfsBytes.byteLength,
    read: (offset, length) => Promise.resolve(rootfsBytes.slice(offset, offset + length)),
    write: (offset, data) => { rootfsBytes.set(data, offset); return Promise.resolve(data.byteLength); },
    flush: () => Promise.resolve(),
  });

  // Connect xterm keyboard → guest console input (track disposable to avoid double-registration on reset).
  onDataDisposable = term.onData(data => {
    guestWrite(new TextEncoder().encode(data));
  });

  machine = new Machine({
    devices: [netDev, consoleDev, entropyDev, blockDev],
    memoryMib: 128,
    cpus: 1,
    initcpio,
    // Static IP: 192.168.86.100/24, gw 192.168.86.1, DNS 192.168.86.1
    // SLIRP intercepts UDP/53 and forwards via DoH.
    // ip=... format: ip:server:gw:netmask:hostname:interface:autoconf
    // 'on' means bring the interface up, 'off' means don't auto-bring up
    cmdline: 'console=hvc0 nr_cpus=1 rdinit=/init ip=192.168.86.100::192.168.86.1:255.255.255.0::eth0:on',
  });

  // Pipe the early boot console (pre-virtio kernel messages) to xterm.
  // Use an AbortController so we can cancel this loop on reset.
  const _bca = new AbortController();
  bootConsoleAbort = _bca;
  (async () => {
    const reader = machine.bootConsole.getReader();
    try {
      for (;;) {
        if (_bca.signal.aborted) { reader.cancel().catch(() => {}); break; }
        const { value, done } = await reader.read();
        if (done || _bca.signal.aborted) break;
        term.write(value);
      }
    } catch (_) {}
  })();

  machine.on('error', ev => {
    setStatus('error', 'err');
    term.write('\r\n\x1b[31m[wasm-shell] kernel error: ' + ev.message + '\x1b[0m\r\n');
    $('boot').disabled = false;
  });

  // DEBUG: Log device tree to console (stringify with replacer for BigInt)
  try {
    if (machine.devicetree) {
      console.log('[WASM Boot] Device tree config:', JSON.stringify(machine.devicetree, (k, v) => typeof v === 'bigint' ? v.toString() : v, 2));
    } else {
      console.log('[WASM Boot] No devicetree property found');
    }
  } catch (e) {
    console.log('[WASM Boot] Error logging device tree:', e.message);
  }
  console.log('[WASM Boot] NetworkDevice created with MAC:', [...guestMac].map(b => b.toString(16).padStart(2, '0')).join(':'));

  try {
    await machine.boot();
    booted = true;
    setStatus('running', 'ok');
    $('reset').disabled = false;
    $('break').disabled = false;
    $('tunnels').disabled = false;
    $('lot-bridge-btn').disabled = false;
    term.focus();
  } catch (err) {
    setStatus('boot failed', 'err');
    term.write('\r\n\x1b[31m[wasm-shell] boot failed: ' + err.message + '\x1b[0m\r\n');
    $('boot').disabled = false;
  }
}

$('boot').onclick = () => doBoat();
$('reset').onclick = () => doBoat();
$('break').onclick = () => guestWrite(new Uint8Array([0x03]));

// ── panel toggles ─────────────────────────────────────────────────────────────
const panels = { tunnels: $('tunnels-panel'), 'lot-bridge': $('lot-bridge-panel') };
function openPanel(name) {
  for (const [k, el] of Object.entries(panels)) el.hidden = (k !== name);
}
function closePanel() { for (const el of Object.values(panels)) el.hidden = true; }

$('tunnels').onclick     = () => $('tunnels-panel').hidden ? openPanel('tunnels')    : closePanel();
$('lot-bridge-btn').onclick = () => $('lot-bridge-panel').hidden ? openPanel('lot-bridge') : closePanel();
$('tunnels-close').onclick  = closePanel;
$('lb-close').onclick       = closePanel;

// ── tunnels panel ─────────────────────────────────────────────────────────────
const tunnelsLogEl = $('tunnels-log');

const TUNNEL_CMD_PREFIX = 'wget -qO /tmp/tunnel-up.sh https://linuxontab.com/local/tunnel-up.sh && sh /tmp/tunnel-up.sh';
const TUNNEL_PORTS_KEY  = 'traits.tunnels.ports';
const TUNNEL_DEFAULT_PORTS = [
  { port: 22,    label: 'ssh',            enabled: true,  channels: null, expose: true  },
  { port: 8080,  label: 'public-http',    enabled: true,  channels: null, expose: false },
  { port: 22000, label: 'syncthing-sync', enabled: true,  channels: null, expose: false },
  { port: 8384,  label: 'syncthing-gui',  enabled: true,  channels: 64,   expose: false },
];
const TUNNEL_RELAY_ENDPOINTS = [
  'https://linuxontab-tunnel.fly.dev',
  'https://tunnel.linuxontab.com',
];
const TUNNEL_EXPOSE_ENDPOINTS = ['https://linuxontab-tunnel.fly.dev'];

function tnLoadPorts() {
  try {
    const raw = localStorage.getItem(TUNNEL_PORTS_KEY);
    if (!raw) return TUNNEL_DEFAULT_PORTS.map(p => ({ ...p }));
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) throw new Error('not array');
    return arr.map(e => {
      const ch = parseInt(e.channels, 10);
      const port = parseInt(e.port, 10);
      let expose = typeof e.expose === 'boolean' ? e.expose : !TUNNEL_DEFAULT_PORTS.some(d => d.port === port);
      return { port, label: String(e.label || ''), enabled: !!e.enabled, channels: Number.isFinite(ch) && ch > 0 ? ch : null, expose };
    }).filter(e => Number.isFinite(e.port) && e.port > 0 && e.port < 65536);
  } catch (_) { return TUNNEL_DEFAULT_PORTS.map(p => ({ ...p })); }
}
function tnSavePorts(arr) {
  try { localStorage.setItem(TUNNEL_PORTS_KEY, JSON.stringify(arr)); } catch (_) {}
}
function tnEnabledPortSpecs() {
  return tnLoadPorts()
    .filter(e => e.enabled)
    .map(e => (e.channels && e.channels > 0) ? (e.port + ':' + e.channels) : String(e.port));
}
function tnBuildDefaultCmd() {
  const specs = tnEnabledPortSpecs();
  return TUNNEL_CMD_PREFIX + ' ' + (specs.length ? specs.join(' ') : '22');
}

function tnLog(line, cls) {
  const d = document.createElement('div');
  d.className = 'tl-' + (cls || 'info');
  d.textContent = line;
  tunnelsLogEl.appendChild(d);
  tunnelsLogEl.scrollTop = tunnelsLogEl.scrollHeight;
}

async function tnFetchRelayStatus(code) {
  if (!code) return null;
  for (const base of TUNNEL_RELAY_ENDPOINTS) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 4000);
      const r = await fetch(base + '/port/status?code=' + encodeURIComponent(code), { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) continue;
      const j = await r.json();
      return { endpoint: base, ...j };
    } catch (_) {}
  }
  return null;
}

function tnRenderPortsConfig() {
  const ports = tnLoadPorts();
  const list = $('tn-ports-list');
  list.innerHTML = '';
  ports.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'tn-port-row';

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = p.enabled;
    cb.onchange = () => { ports[i].enabled = cb.checked; tnSavePorts(ports); };

    const num = document.createElement('span');
    num.className = 'tn-port-num'; num.textContent = ':' + p.port;

    const lbl = document.createElement('input');
    lbl.type = 'text'; lbl.className = 'tn-port-label-input'; lbl.value = p.label; lbl.placeholder = 'label';
    lbl.onchange = () => { ports[i].label = lbl.value; tnSavePorts(ports); };

    const exp = document.createElement('label');
    exp.className = 'tn-port-expose' + (p.expose ? ' tn-expose-on' : '');
    const expCb = document.createElement('input');
    expCb.type = 'checkbox'; expCb.checked = !!p.expose;
    expCb.onchange = () => { ports[i].expose = expCb.checked; exp.className = 'tn-port-expose' + (expCb.checked ? ' tn-expose-on' : ''); tnSavePorts(ports); };
    exp.appendChild(expCb);
    exp.append('expose');

    const del = document.createElement('button');
    del.className = 'tn-port-del'; del.textContent = '×'; del.title = 'remove port';
    del.onclick = () => { ports.splice(i, 1); tnSavePorts(ports); tnRenderPortsConfig(); };

    row.append(cb, num, lbl, exp, del);
    list.appendChild(row);
  });
}
tnRenderPortsConfig();

$('tn-add-btn').onclick = () => {
  const portVal = parseInt($('tn-add-port').value, 10);
  if (!Number.isFinite(portVal) || portVal < 1 || portVal > 65535) return;
  const label = $('tn-add-label').value.trim();
  const ports = tnLoadPorts();
  if (!ports.find(p => p.port === portVal)) {
    ports.push({ port: portVal, label, enabled: true, channels: null, expose: true });
    tnSavePorts(ports);
    tnRenderPortsConfig();
    $('tn-add-port').value = '';
    $('tn-add-label').value = '';
  }
};

async function tnRefresh() {
  tnLog('scanning relay…', 'info');
  const list = $('tunnels-list');
  list.innerHTML = '';
  // Without serialVfs we can't exec in the guest; show a relay-query-only view.
  const code = localStorage.getItem('traits.tunnels.lastCode') || '';
  if (code) {
    const s = await tnFetchRelayStatus(code);
    const row = document.createElement('div');
    row.className = 'tn-row';
    if (s) {
      const active = !!s.active;
      const guestPorts = Array.isArray(s.guest_ports) ? s.guest_ports : [];
      row.innerHTML = '<span class="tn-code">code: ' + code + '</span>' +
        '<div class="tn-meta ' + (active ? 'tn-relay-ok' : 'tn-relay-warn') + '">relay: ' +
        (active ? '✓ active' : '✗ inactive') +
        (guestPorts.length ? '  guest=' + guestPorts.join(',') : '') + '</div>';
    } else {
      row.innerHTML = '<span class="tn-code">code: ' + code + '</span><div class="tn-meta tn-relay-err">relay: unreachable</div>';
    }
    list.appendChild(row);
    tnLog('done', 'ok');
  } else {
    const row = document.createElement('div');
    row.className = 'tn-row tn-empty';
    row.textContent = 'no active code — run tunnel-up in the guest to get one';
    list.appendChild(row);
    tnLog('no code cached; run tunnel-up in guest first', 'info');
  }
}

$('tunnels-refresh').onclick = () => tnRefresh();

$('tn-run-btn').onclick = () => {
  const cmd = tnBuildDefaultCmd();
  tnLog('sending to guest: ' + cmd, 'cmd');
  guestSend(cmd);
  tnLog('sent — watch the terminal', 'ok');
};

// ── lot-bridge panel ──────────────────────────────────────────────────────────
(function () {
  const lbBtn       = $('lot-bridge-btn');
  const lbPanel     = $('lot-bridge-panel');
  const lbClose     = $('lb-close');
  const lbStart     = $('lb-start');
  const lbStop      = $('lb-stop');
  const lbStatusBtn = $('lb-status-btn');
  const lbRefresh   = $('lb-refresh');
  const lbPorts     = $('lb-ports');
  const lbRelay     = $('lb-relay');
  const lbDot       = $('lb-dot');
  const lbStateLabel = $('lb-state-label');
  const lbCodeVal   = $('lb-code-val');
  const lbPoolInfo  = $('lb-pool-info');
  const lbLog       = $('lb-log');

  function lbAppend(text, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    lbLog.appendChild(line);
    lbLog.scrollTop = lbLog.scrollHeight;
  }

  function lbSetRunning(running, code) {
    lbDot.className = running ? 'ok' : '';
    lbStateLabel.textContent = running ? 'running' : 'not running';
    lbCodeVal.textContent = (running && code) ? 'code: ' + code : '';
  }

  // guestExec: type a command into the guest terminal and wait.
  // Because we don't have serialVfs output capture, this just sends the cmd
  // and returns after a delay. Output appears in the terminal directly.
  async function lbExec(cmd, opts) {
    guestSend(cmd);
    const wait = (opts && opts.timeout) ? Math.min(opts.timeout, 3000) : 1500;
    await new Promise(r => setTimeout(r, wait));
    return { stdout: '', exitCode: 0 };
  }

  async function lbReadStatus() {
    // Ask the guest to print the status JSON to a known marker line.
    guestSend('echo __LB_STATUS__; cat /tmp/lot-bridge.status.json 2>/dev/null || echo __LB_NOFILE__; echo __LB_END__');
    lbAppend('checking status (check terminal output)…', 'lb-info');
    await new Promise(r => setTimeout(r, 2000));
    return null; // can't capture output without serialVfs
  }

  async function lbRefreshUI() {
    lbAppend('refresh: check terminal for lot-bridge status output', 'lb-info');
    guestSend('cat /tmp/lot-bridge.status.json 2>/dev/null || echo "(lot-bridge not running)"');
    guestSend('cat /tmp/lot-bridge.code 2>/dev/null && echo || true');
    await new Promise(r => setTimeout(r, 1000));
  }

  async function lbDoStart() {
    const ports = (lbPorts.value || '22 8080').trim().split(/\s+/).filter(Boolean);
    const relay = (lbRelay.value || 'https://linuxontab-tunnel.fly.dev').trim();
    if (!ports.length) { lbAppend('no ports specified', 'lb-err'); return; }

    lbAppend('downloading lot-bridge binary…', 'lb-info');
    guestSend(
      'rm -f /usr/local/bin/lot-bridge; ' +
      'wget -qO /usr/local/bin/lot-bridge https://raw.githubusercontent.com/kilian-ai/linuxontab/main/local/lot-bridge ' +
      '|| wget -qO /usr/local/bin/lot-bridge https://linuxontab.com/local/lot-bridge; ' +
      'chmod +x /usr/local/bin/lot-bridge; ' +
      '/usr/local/bin/lot-bridge --version 2>&1'
    );
    lbAppend('waiting for download (watch terminal)…', 'lb-info');
    await new Promise(r => setTimeout(r, 8000));

    guestSend('lot-bridge down 2>/dev/null; killall -q websocat 2>/dev/null; killall -q lot-bridge 2>/dev/null; true');
    guestSend('rm -f /tmp/lot-bridge.code /tmp/lot-bridge.status.json /tmp/lot-bridge.pid');
    await new Promise(r => setTimeout(r, 600));

    const cmd = `LOT_BRIDGE_RELAY='${relay}' lot-bridge up ${ports.join(' ')} > /tmp/lot-bridge.log 2>&1 &`;
    lbAppend('starting: ' + cmd, 'lb-info');
    guestSend(cmd);
    lbAppend('sent — watching for code (check terminal)…', 'lb-info');

    // Poll for code via terminal output — we can only ask the guest to print it.
    for (let i = 0; i < 8; i++) {
      await new Promise(r => setTimeout(r, 1500));
      guestSend('cat /tmp/lot-bridge.code 2>/dev/null | tr -d "\\n"; echo');
    }
    lbAppend('done — copy code from terminal output above', 'lb-ok');
    lbSetRunning(true, '?');
  }

  async function lbDoStop() {
    lbAppend('stopping…', 'lb-info');
    guestSend('lot-bridge down 2>/dev/null; killall -q websocat 2>/dev/null; killall -q lot-bridge 2>/dev/null; true');
    await new Promise(r => setTimeout(r, 800));
    lbSetRunning(false, null);
    lbPoolInfo.textContent = '';
    lbAppend('stop command sent', 'lb-ok');
  }

  lbStart.onclick = async () => {
    lbStart.disabled = true;
    try { await lbDoStart(); }
    catch (e) { lbAppend('error: ' + e.message, 'lb-err'); }
    finally { lbStart.disabled = false; }
  };

  lbStop.onclick = async () => {
    lbStop.disabled = true;
    try { await lbDoStop(); }
    finally { lbStop.disabled = false; }
  };

  lbStatusBtn.onclick = async () => {
    lbStatusBtn.disabled = true;
    try {
      lbAppend('requesting status (see terminal)…', 'lb-info');
      guestSend('cat /tmp/lot-bridge.status.json 2>/dev/null | head -20 || echo "(not running)"');
      guestSend('cat /tmp/lot-bridge.code 2>/dev/null && echo || true');
    } finally { lbStatusBtn.disabled = false; }
  };

  lbRefresh.onclick = async () => {
    lbRefresh.disabled = true;
    try { await lbRefreshUI(); }
    finally { lbRefresh.disabled = false; }
  };

  // Expose guestSend globally for test/debug automation
  window.guestSend = guestSend;
})();
</script>
</body>
</html>
