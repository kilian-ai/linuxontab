# Raw TCP proxy to the second Node WS listener (port 4344, not 8787).
# websocat uses ws://...:4344/port/guest to bypass Fly's HTTP-proxy
# write-timeout (~30s) that fires when v86 drains uploads slowly.
# internal_port=4344 MUST equal the public port=4344: for same-org Fly apps
# (linuxontab-net WISP server), Fly routes via 6PN to the machine's IP at
# the external port number, so ext-port == int-port is required for it to work.
[[services]]
  protocol = "tcp"
  internal_port = 4344
  [[services.ports]]
    port = 4344

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
