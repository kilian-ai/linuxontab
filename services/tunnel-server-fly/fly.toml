app = "linuxontab-tunnel"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  TCP_POOL_BASE = "6660"
  TCP_POOL_SIZE = "10"
  # TCP_PORTS overrides BASE+SIZE. Each port here must also have a [[services]]
  # block below so Fly's proxy forwards external traffic to the container.
  # Port 22 is reserved by Fly for machine SSH and cannot be used here.
  TCP_PORTS = "2222,3000,4000,5000,6000,7000,8000,8080,8081,8443,8888,9000,9090,6660,6661,6662,6663,6664,6665,6666,6667,6668,6669"
  TCP_PUBLIC_HOST = "linuxontab-tunnel.fly.dev"
  # Public wss URL announced to clients — set to the custom domain once mapped:
  # TUNNEL_PUBLIC_URL = "wss://tunnel.linuxontab.com"
  # Second listener that [[services]] TCP proxy hits directly (no http_service proxy).
  # MUST match the [[services.ports]] port=4344 below so Fly's 6PN routing
  # from linuxontab-net reaches the correct Node listener (ext port == machine port).
  RAW_PORT = "4344"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# Public TCP bridge pool. Each port here corresponds to a slot in
# server.js's tcpListeners map (TCP_POOL_BASE..+TCP_POOL_SIZE). Public
# clients connect to <app>.fly.dev:<port>; the relay bridges to the
# guest's internal port via the registered code.
[[services]]
  protocol = "tcp"
  internal_port = 6660
  [[services.ports]]
    port = 6660

[[services]]
  protocol = "tcp"
  internal_port = 6661
  [[services.ports]]
