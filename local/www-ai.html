<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Agent — LinuxOnTab</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117; color: #c9d1d9;
  font: 13px/1.6 'SF Mono','Fira Code',ui-monospace,monospace;
  height: 100dvh; display: flex; flex-direction: column;
}
header {
  padding: 8px 16px; border-bottom: 1px solid #21262d;
  display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap;
}
header a { color: #8b949e; text-decoration: none; font-size: 12px; }
header a:hover { color: #58a6ff; }
.sep { color: #444d56; }
.hdr-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
select.model-sel {
  background: #161b22; border: 1px solid #21262d; border-radius: 3px;
  color: #8b949e; font: inherit; font-size: 11px; padding: 2px 6px; outline: none;
  cursor: pointer;
}
select.model-sel:focus { border-color: #58a6ff; }
.hdr-btn {
  background: none; border: 1px solid #21262d; border-radius: 3px;
  color: #8b949e; font: inherit; font-size: 11px; padding: 2px 8px;
  cursor: pointer;
}
.hdr-btn:hover { border-color: #58a6ff; color: #58a6ff; }
.stop-btn {
  background: #3d1f1f; border: 1px solid #f85149; border-radius: 3px;
  color: #f85149; font: inherit; font-size: 11px; padding: 2px 10px;
  cursor: pointer;
}
.msgs {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.msg-wrap { display: contents; }
.msg {
  max-width: 90%; border-radius: 6px; padding: 8px 12px;
  line-height: 1.55; word-break: break-word; font-size: 13px;
}
.msg.user {
  background: #1a3a5c; color: #c9d1d9; align-self: flex-end;
  white-space: pre-wrap;
}
.msg.assistant {
  background: #161b22; border: 1px solid #21262d; color: #c9d1d9;
  align-self: flex-start; padding: 10px 12px; max-width: 96%;
}
.msg.status {
  color: #8b949e; font-size: 11px; font-style: italic;
  align-self: center; text-align: center;
}
/* Inside assistant bubble */
.ai-text { white-space: pre-wrap; padding: 2px 0; }
.ai-text:empty { display: none; }
.tool-call {
  margin: 6px 0 0; border-radius: 4px; overflow: hidden;
  border: 1px solid #21262d; border-left: 3px solid #58a6ff;
}
.tool-call .tc-hdr {
  background: #0d1117; color: #58a6ff; font-size: 10px; font-style: normal;
  padding: 3px 8px; border-bottom: 1px solid #21262d; display: flex; gap: 6px;
}
.tool-call pre {
  margin: 0; padding: 6px 8px; color: #79c0ff; background: #0d1117;
  white-space: pre-wrap; word-break: break-all; font-size: 11px; max-height: 200px; overflow-y: auto;
}
.tool-result {
  margin: 0 0 4px; border-radius: 0 0 4px 4px; overflow: hidden;
  border: 1px solid #21262d; border-top: none; border-left: 3px solid #3fb950;
}
.tool-result.err { border-left-color: #f85149; }
.tool-result .tr-hdr {
  background: #0d1117; color: #8b949e; font-size: 10px;
  padding: 2px 8px; border-bottom: 1px solid #21262d;
}
.tool-result.err .tr-hdr { color: #f85149; }
.tool-result pre {
  margin: 0; padding: 6px 8px; color: #c9d1d9; background: #0d1117;
  white-space: pre-wrap; word-break: break-all; font-size: 11px;
  max-height: 300px; overflow-y: auto;
}
.tool-result pre:empty::before { content: '(no output)'; color: #444d56; }
.running-indicator {
  color: #8b949e; font-size: 11px; padding: 4px 2px;
  display: flex; align-items: center; gap: 6px;
}
.spinner { animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.input-row {
  padding: 10px 16px; border-top: 1px solid #21262d;
  display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
}
textarea {
  flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 4px;
  color: #c9d1d9; font: inherit; font-size: 13px; padding: 8px 10px;
  resize: none; min-height: 40px; max-height: 160px; outline: none;
  overflow-y: auto; line-height: 1.5;
}
textarea:focus { border-color: #58a6ff; }
.send-btn {
  background: #1f6feb; border: none; border-radius: 4px;
  color: #fff; padding: 8px 16px; cursor: pointer; font: inherit; font-size: 12px;
  align-self: flex-end; flex-shrink: 0;
}
.send-btn:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body x-data="chat()" x-init="init()">

<header>
  <a href="../">&#8592; home</a>
  <span class="sep">/</span>
  <span style="color:#58a6ff">AI agent</span>
  <div class="hdr-right">
    <select class="model-sel" x-model="model" :disabled="busy">
      <option value="gpt-4o-mini">gpt-4o-mini</option>
      <option value="gpt-4o">gpt-4o</option>
    </select>
    <button class="hdr-btn" @click="clearChat()" :disabled="busy">clear</button>
    <button class="stop-btn" x-show="busy" @click="stop=true">&#9632; stop</button>
  </div>
</header>

<div class="msgs" x-ref="msgs">
  <template x-for="(m,i) in msgs" :key="i">
    <div class="msg-wrap">
      <div x-show="m.role==='user'"      class="msg user"      x-text="m.text"></div>
      <div x-show="m.role==='assistant'" class="msg assistant" x-html="m.html"></div>
      <div x-show="m.role==='status'"    class="msg status"    x-text="m.text"></div>
    </div>
  </template>
  <div class="msg status" x-show="busy" style="display:flex;gap:6px;align-items:center">
    <span class="spinner">&#8635;</span>
    <span x-text="busyLabel"></span>
  </div>
</div>

<div class="input-row">
  <textarea
    x-ref="inp"
    x-model="draft"
    @keydown.enter.exact.prevent="send()"
    @keydown.enter.shift="null"
    :disabled="busy"
    placeholder="Ask the agent to build or modify the web apps… Enter to send, Shift+Enter for newline"
    rows="2"
    @input="$el.style.height='auto'; $el.style.height=Math.min($el.scrollHeight,160)+'px'"
  ></textarea>
  <button class="send-btn" @click="send()" :disabled="busy || !draft.trim()">send</button>
</div>

<script>
// ---------------------------------------------------------------------------
// System prompt — includes full shell-ui-agent instructions + tool protocol
// ---------------------------------------------------------------------------
const SYSTEM = `You are the LinuxOnTab Web UI Agent. You are running inside an Alpine Linux guest (v86/WASM) served in a browser.

You manage a multi-app web UI at ~/public/ (= /mnt/host/public/) served by busybox httpd on port 8080.
The browser-facing tunnel URL is: https://linuxontab-tunnel.fly.dev/port/http/CODE/8080/ (CODE = value in /tmp/tunnel.code)

## File layout
\`\`\`
~/public/
├── index.html          ← app launcher (dark grid, nav cards)
├── shell/index.html    ← Alpine.js interactive shell  (CGI: ../cgi-bin/run.cgi)
├── editor/index.html   ← CodeMirror 5 file editor     (CGI: ../cgi-bin/fs.cgi)
├── ai/index.html       ← this AI agent                (CGI: ../cgi-bin/ai.cgi)
├── games/index.html    ← Phaser 3 game(s)
└── cgi-bin/
    ├── run.cgi   POST {"cmd":"…"} → {"stdout":"…","stderr":"…","exit":N}
    ├── fs.cgi    GET ?action=list|read&path=… / POST ?action=write&path=…
    └── ai.cgi    POST OpenAI JSON → proxied response
\`\`\`

## How to write/overwrite a file
Use a heredoc:
\`\`\`
cat > ~/public/PATH/FILE << 'HEREDOC'
...full file content...
HEREDOC
\`\`\`
For CGI scripts also run: chmod +x ~/public/cgi-bin/SCRIPT.cgi
Edits are live immediately on hard-refresh.

## Constraints
- busybox sh only — POSIX sh. jq, curl, wget available. No bash.
- Alpine.js 3, CodeMirror 5, Phaser 3 — CDN only. No build, no npm.
- All pages are single HTML files with inline CSS+JS.
- Read files before rewriting them so you don't lose existing content.

## Color palette (keep consistent across all pages)
background #0d1117 | panel #161b22 | border #21262d
muted #8b949e | text #c9d1d9 | accent #58a6ff | green #3fb950 | red #f85149

## Shell tool — CRITICAL RULES

Execute shell commands by emitting blocks in this exact form:

<shell>
command here
</shell>

- ONE <shell> block per logical command.
- Separate multiple statements inside one block with newlines or semicolons — NEVER by adjacency.
- Combined stdout+stderr and exit code come back as: <shell-result exit=N>output</shell-result>
- After seeing results, continue: explain outcome, run more commands, or declare done.
- Prefer non-destructive, idempotent operations. Read before overwriting large files.
- NEVER wrap <shell> blocks in markdown code fences. Emit the raw tags directly.`;

// ---------------------------------------------------------------------------
// Alpine.js component
// ---------------------------------------------------------------------------
function chat() {
  return {
    msgs:      [],   // display: [{role:'user'|'assistant'|'status', text?, html?}]
    apiMsgs:   [],   // OpenAI-format conversation history (no system msg)
    draft:     '',
    busy:      false,
    stop:      false,
    busyLabel: 'thinking\u2026',
    model:     'gpt-4o-mini',
    maxIters:  25,

    init() {
      const code = location.href.match(/\/port\/http\/(\w+)\//)?.[1] ?? '';
      this.msgs.push({ role: 'status',
        text: 'agent ready \u00b7 ' + this.model + (code ? ' \u00b7 tunnel ' + code : '') });
      this.$nextTick(() => this.$refs.inp?.focus());
    },

    clearChat() {
      if (this.busy) return;
      this.msgs    = [];
      this.apiMsgs = [];
      this.msgs.push({ role: 'status', text: 'conversation cleared' });
    },

    // -- HTML helpers -------------------------------------------------------

    esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    },

    renderText(t) {
      const s = (t || '').trim();
      return s ? `<div class="ai-text">${this.esc(s)}</div>` : '';
    },

    renderShellCall(cmd) {
      return `<div class="tool-call">`
           + `<div class="tc-hdr">&#9658; shell</div>`
           + `<pre>${this.esc(cmd)}</pre>`
           + `</div>`;
    },

    renderToolResult(output, exitCode) {
      const cls = exitCode === 0 ? 'ok' : 'err';
      const out = (output.length > 6000)
        ? output.slice(0, 6000) + '\n\u2026 [truncated]'
        : output;
      return `<div class="tool-result ${cls}">`
           + `<div class="tr-hdr">exit=${exitCode}</div>`
           + `<pre>${this.esc(out)}</pre>`
           + `</div>`;
    },

    // Render a full AI reply text (may contain <shell> blocks) as HTML,
    // but WITHOUT executing anything — just visual.
    renderReplyHtml(text) {
      const re = /<shell>([\s\S]*?)<\/shell>/g;
      let html = '', last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) html += this.renderText(text.slice(last, m.index));
        html += this.renderShellCall(m[1].trim());
        last = m.index + m[0].length;
      }
      if (last < text.length) html += this.renderText(text.slice(last));
      return html;
    },

    // -- API calls ----------------------------------------------------------

    async callAI(messages) {
      const r = await fetch('../cgi-bin/ai.cgi', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          model:    this.model,
          messages: [{ role: 'system', content: SYSTEM }, ...messages],
          max_tokens: 16384
        })
      });
      const j = await r.json();
      if (j.error) throw new Error(
        typeof j.error === 'string' ? j.error : JSON.stringify(j.error));
      return j.choices?.[0]?.message?.content ?? '(empty response)';
    },

    async runCmd(cmd) {
      try {
        const r = await fetch('../cgi-bin/run.cgi', {
          method:  'POST',
          headers: { 'content-type': 'application/json' },
          body:    JSON.stringify({ cmd })
        });
        return await r.json();
      } catch (e) {
        return { stdout: '', stderr: 'fetch error: ' + e.message, exit: -1 };
      }
    },

    // -- Main send + tool loop ----------------------------------------------

    async send() {
      const text = this.draft.trim();
      if (!text || this.busy) return;
      this.draft = '';
      this.busy  = true;
      this.stop  = false;

      this.msgs.push({ role: 'user', text });
      this.apiMsgs.push({ role: 'user', content: text });
      this.scroll();

      // Create agent bubble and helper to append HTML into it
      const agentIdx = this.msgs.length;
      this.msgs.push({ role: 'assistant', html: '' });
      let agentHtml = '';
      const append = (chunk) => {
        agentHtml += chunk;
        this.msgs[agentIdx] = { role: 'assistant', html: agentHtml };
        this.scroll();
      };

      try {
        this.busyLabel = 'thinking\u2026';
        let reply = await this.callAI([...this.apiMsgs]);
        this.apiMsgs.push({ role: 'assistant', content: reply });

        let iters = 0;
        while (iters < this.maxIters && !this.stop) {
          const shells = [...reply.matchAll(/<shell>([\s\S]*?)<\/shell>/g)];

          // Render AI reply text + shell call divs into the bubble
          const re2 = /<shell>([\s\S]*?)<\/shell>/g;
          let last = 0, m;
          while ((m = re2.exec(reply)) !== null) {
            if (m.index > last) append(this.renderText(reply.slice(last, m.index)));
            append(this.renderShellCall(m[1].trim()));
            last = m.index + m[0].length;
          }
          if (last < reply.length) append(this.renderText(reply.slice(last)));

          if (shells.length === 0) break; // no tools — done

          iters++;

          // Execute each shell block in sequence and collect results
          let resultsMsg = '';
          for (const match of shells) {
            if (this.stop) break;
            const cmd = match[1].trim();
            this.busyLabel = 'running\u2026';
            const res = await this.runCmd(cmd);
            const combined = (res.stdout ?? '') + (res.stderr ?? '');
            append(this.renderToolResult(combined, res.exit ?? -1));
            const truncated = combined.length > 8192
              ? combined.slice(0, 8192) + '\n[truncated]'
              : combined;
            resultsMsg += `<shell-result exit=${res.exit ?? -1}>\n${truncated}\n</shell-result>\n`;
          }

          if (this.stop) break;

          // Feed all results back to AI and get next reply
          this.apiMsgs.push({ role: 'user', content: resultsMsg });
          this.busyLabel = 'thinking\u2026';
          reply = await this.callAI([...this.apiMsgs]);
          this.apiMsgs.push({ role: 'assistant', content: reply });
        }

        if (iters >= this.maxIters) {
          this.msgs.push({ role: 'status', text: 'hit max iterations (' + this.maxIters + ')' });
        }
        if (this.stop) {
          this.msgs.push({ role: 'status', text: 'stopped' });
        }

      } catch (e) {
        this.msgs.push({ role: 'status', text: 'error: ' + e.message });
      }

      this.busy = false;
      this.$nextTick(() => { this.scroll(); this.$refs.inp?.focus(); });
    },

    scroll() {
      this.$nextTick(() => {
        const el = this.$refs.msgs;
        if (el) el.scrollTop = el.scrollHeight;
      });
    }
  };
}
</script>
</body>
</html>
